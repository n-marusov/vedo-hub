# Pre-commit hooks for VEDO Core
# See https://pre-commit.com for more information
#
# Install:   pre-commit install
# Run all:   pre-commit run --all-files
# Run one:   pre-commit run <hook-id> --all-files

repos:
  # ============================================================================
  # Generic checks — trailing whitespace, EOF, YAML/JSON validation
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^src/services/frontend/.*\.css$
      - id: end-of-file-fixer
        exclude: ^src/services/frontend/.*\.css$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # ============================================================================
  # Python — ruff (lint + format)
  # Uses per-service pyproject.toml [tool.ruff] configuration
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^src/services/(metrics-service|document-extractor|ticket-classifier)/
      - id: ruff-format
        files: ^src/services/(metrics-service|document-extractor|ticket-classifier)/

  # ============================================================================
  # TypeScript / Vue — biome (lint + format)
  # Uses per-service biome.json configuration
  # ============================================================================
  - repo: https://github.com/biomejs/pre-commit
    rev: v1.9.4
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@1.9.4"]
        files: ^src/services/(frontend|publish-browse-ui)/

  # ============================================================================
  # Go — gofmt + go vet + golangci-lint (per-service)
  # golangci-lint uses per-service .golangci.yml configuration
  # ============================================================================
  - repo: local
    hooks:
      - id: gofmt
        name: go fmt + vet
        entry: sh src/scripts/pre-commit-gofmt.sh
        language: system
        files: ^src/services/.*\.go$
        pass_filenames: false
      - id: golangci-lint
        name: golangci-lint
        entry: sh src/scripts/pre-commit-golangci-lint.sh
        language: system
        files: ^src/services/.*\.go$
        pass_filenames: false

  # ============================================================================
  # Rust — cargo fmt + cargo clippy (per-service)
  # Clippy uses per-service [lints.clippy] in Cargo.toml
  # ============================================================================
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: sh src/scripts/pre-commit-cargo-fmt.sh
        language: system
        files: ^src/services/.*\.rs$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: sh src/scripts/pre-commit-cargo-clippy.sh
        language: system
        files: ^src/services/.*\.rs$
        pass_filenames: false
