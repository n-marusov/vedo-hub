# Operation Inventory for vedo-core
# Source: API-SURFACE-001 contract
# Every UI operation has exactly one canonical operation_id and at least one API equivalent
schema_version: 1

operations:
  # ============================================================
  # Graph Navigation (ONT-GRAPH-001, ONT-SEARCH-001)
  # ============================================================
  - operation_id: OP-view-graph-tree
    ui_location: GraphView/ClassTree
    description: View hierarchical class tree for ontology
    api_equivalents:
      - surface: rest
        method: GET
        path: "/api/v1/ontologies/{ontologyId}/classes/tree"
      - surface: graphql
        operation: "Query.classChildren"
    coverage_status: covered

  - operation_id: OP-expand-node
    ui_location: GraphView/ClassTree/TreeNode
    description: Expand tree node to reveal children
    api_equivalents:
      - surface: graphql
        operation: "Query.classChildren"
        parameters:
          parentId: "{parentId}"
          depth: 2
    coverage_status: covered

  - operation_id: OP-search-entities
    ui_location: GraphView/SearchBar
    description: Search classes and properties by query
    api_equivalents:
      - surface: rest
        method: GET
        path: "/api/v1/ontologies/{ontologyId}/search"
        parameters:
          query: "{query}"
          type: "{type}"
      - surface: graphql
        operation: "Query.searchOntology"
    coverage_status: covered

  - operation_id: OP-filter-by-type
    ui_location: GraphView/ClassTree/FilterPanel
    description: Filter classes/properties by type, abstract, deprecated
    api_equivalents:
      - surface: rest
        method: GET
        path: "/api/v1/ontologies/{ontologyId}/classes"
        parameters:
          showAbstract: "{showAbstract}"
          showDeprecated: "{showDeprecated}"
    coverage_status: covered

  - operation_id: OP-focus-class
    ui_location: GraphView/DetailPanel
    description: Focus on class to show details, parents, children, properties
    api_equivalents:
      - surface: rest
        method: GET
        path: "/api/v1/ontologies/{ontologyId}/classes/{classId}"
      - surface: graphql
        operation: "Query.class"
    coverage_status: covered

  # ============================================================
  # Class Management (ONT-CLASS-001)
  # ============================================================
  - operation_id: OP-list-classes
    ui_location: TBoxEditor/ClassList
    description: List all classes in ontology
    api_equivalents:
      - surface: rest
        method: GET
        path: "/api/v1/ontologies/{ontologyId}/classes"
    coverage_status: covered

  - operation_id: OP-get-class
    ui_location: TBoxEditor/ClassDetailModal
    description: Get class details with properties and annotations
    api_equivalents:
      - surface: rest
        method: GET
        path: "/api/v1/ontologies/{ontologyId}/classes/{classId}"
    coverage_status: covered

  - operation_id: OP-create-class
    ui_location: TBoxEditor/CreateClassModal
    description: Create new class with label, comment, parents
    api_equivalents:
      - surface: rest
        method: POST
        path: "/api/v1/ontologies/{ontologyId}/classes"
    coverage_status: covered

  - operation_id: OP-update-class
    ui_location: TBoxEditor/ClassDetailModal
    description: Update class label, comment, or hierarchy
    api_equivalents:
      - surface: rest
        method: PATCH
        path: "/api/v1/ontologies/{ontologyId}/classes/{classId}"
    coverage_status: covered

  - operation_id: OP-delete-class
    ui_location: TBoxEditor/ClassContextMenu
    description: Delete class (soft or hard delete)
    api_equivalents:
      - surface: rest
        method: DELETE
        path: "/api/v1/ontologies/{ontologyId}/classes/{classId}"
    coverage_status: covered

  # ============================================================
  # Property Management (ONT-PROP-001)
  # ============================================================
  - operation_id: OP-list-properties
    ui_location: TBoxEditor/PropertyList
    description: List all properties (ObjectProperty, DatatypeProperty)
    api_equivalents:
      - surface: rest
        method: GET
        path: "/api/v1/ontologies/{ontologyId}/properties"
    coverage_status: covered

  - operation_id: OP-get-property
    ui_location: TBoxEditor/PropertyDetailModal
    description: Get property details with domain, range, characteristics
    api_equivalents:
      - surface: rest
        method: GET
        path: "/api/v1/ontologies/{ontologyId}/properties/{propertyId}"
    coverage_status: covered

  - operation_id: OP-create-property
    ui_location: TBoxEditor/CreatePropertyModal
    description: Create ObjectProperty or DatatypeProperty
    api_equivalents:
      - surface: rest
        method: POST
        path: "/api/v1/ontologies/{ontologyId}/properties"
    coverage_status: covered

  - operation_id: OP-update-property
    ui_location: TBoxEditor/PropertyDetailModal
    description: Update property domain, range, or characteristics
    api_equivalents:
      - surface: rest
        method: PATCH
        path: "/api/v1/ontologies/{ontologyId}/properties/{propertyId}"
    coverage_status: covered

  - operation_id: OP-delete-property
    ui_location: TBoxEditor/PropertyContextMenu
    description: Delete property
    api_equivalents:
      - surface: rest
        method: DELETE
        path: "/api/v1/ontologies/{ontologyId}/properties/{propertyId}"
    coverage_status: covered

  # ============================================================
  # Individual Management (ONT-INDIV-001)
  # ============================================================
  - operation_id: OP-list-individuals
    ui_location: ABoxEditor/IndividualList
    description: List all individuals (instances)
    api_equivalents:
      - surface: rest
        method: GET
        path: "/api/v1/ontologies/{ontologyId}/individuals"
    coverage_status: covered

  - operation_id: OP-get-individual
    ui_location: ABoxEditor/IndividualDetailModal
    description: Get individual details with property values
    api_equivalents:
      - surface: rest
        method: GET
        path: "/api/v1/ontologies/{ontologyId}/individuals/{individualId}"
    coverage_status: covered

  - operation_id: OP-create-individual
    ui_location: ABoxEditor/CreateIndividualModal
    description: Create new individual (instance of class)
    api_equivalents:
      - surface: rest
        method: POST
        path: "/api/v1/ontologies/{ontologyId}/individuals"
    coverage_status: covered

  - operation_id: OP-update-individual
    ui_location: ABoxEditor/IndividualDetailModal
    description: Update individual property values
    api_equivalents:
      - surface: rest
        method: PATCH
        path: "/api/v1/ontologies/{ontologyId}/individuals/{individualId}"
    coverage_status: covered

  - operation_id: OP-delete-individual
    ui_location: ABoxEditor/IndividualContextMenu
    description: Delete individual
    api_equivalents:
      - surface: rest
        method: DELETE
        path: "/api/v1/ontologies/{ontologyId}/individuals/{individualId}"
    coverage_status: covered

  # ============================================================
  # Versioning (VCS-COMMIT-001, VCS-BRANCH-001)
  # ============================================================
  - operation_id: OP-list-commits
    ui_location: VersionPanel/CommitList
    description: List commits on branch with pagination
    api_equivalents:
      - surface: rest
        method: GET
        path: "/api/v1/ontologies/{ontologyId}/commits"
      - surface: graphql
        operation: "Query.commits"
    coverage_status: covered

  - operation_id: OP-get-commit
    ui_location: VersionPanel/CommitDetail
    description: Get commit details with diff and stats
    api_equivalents:
      - surface: rest
        method: GET
        path: "/api/v1/ontologies/{ontologyId}/commits/{sha}"
      - surface: graphql
        operation: "Query.commit"
    coverage_status: covered

  - operation_id: OP-create-commit
    ui_location: VersionPanel/CommitModal
    description: Create commit with message and changes
    api_equivalents:
      - surface: rest
        method: POST
        path: "/api/v1/ontologies/{ontologyId}/commits"
      - surface: graphql
        operation: "Mutation.createCommit"
    coverage_status: covered

  - operation_id: OP-list-branches
    ui_location: VersionPanel/BranchList
    description: List all branches for ontology
    api_equivalents:
      - surface: rest
        method: GET
        path: "/api/v1/ontologies/{ontologyId}/branches"
      - surface: graphql
        operation: "Query.branches"
    coverage_status: covered

  - operation_id: OP-create-branch
    ui_location: VersionPanel/CreateBranchModal
    description: Create new branch from source
    api_equivalents:
      - surface: rest
        method: POST
        path: "/api/v1/ontologies/{ontologyId}/branches"
      - surface: graphql
        operation: "Mutation.createBranch"
    coverage_status: covered

  - operation_id: OP-merge-branches
    ui_location: VersionPanel/MergePanel
    description: Merge source branch into target
    api_equivalents:
      - surface: rest
        method: POST
        path: "/api/v1/ontologies/{ontologyId}/merge"
      - surface: graphql
        operation: "Mutation.merge"
    coverage_status: covered

  # ============================================================
  # Collaboration comments (COL-CMNT-001)
  # ============================================================
  - operation_id: OP-list-comments
    ui_location: CollaborationPanel/CommentList
    description: List comments on node
    api_equivalents:
      - surface: rest
        method: GET
        path: "/api/v1/ontologies/{ontologyId}/nodes/{nodeId}/comments"
      - surface: websocket
        event: "comment.list"
    coverage_status: covered

  - operation_id: OP-add-comment
    ui_location: CollaborationPanel/CommentInput
    description: Add comment to node
    api_equivalents:
      - surface: rest
        method: POST
        path: "/api/v1/ontologies/{ontologyId}/nodes/{nodeId}/comments"
      - surface: websocket
        event: "comment.add"
    coverage_status: covered

  # ============================================================
  # Import/Export (API-IMPEXP-001)
  # ============================================================
  - operation_id: OP-export-ontology
    ui_location: ExportDialog
    description: Export ontology in Turtle, RDF/XML, or N-Triples format
    api_equivalents:
      - surface: rest
        method: GET
        path: "/api/v1/ontologies/{ontologyId}/export"
        parameters:
          format: "{format}"
    coverage_status: covered

  - operation_id: OP-import-ontology
    ui_location: ImportDialog
    description: Import ontology from file (Turtle, RDF/XML)
    api_equivalents:
      - surface: rest
        method: POST
        path: "/api/v1/ontologies/{ontologyId}/import"
        content_type: "multipart/form-data"
    coverage_status: covered

  # ============================================================
  # Webhooks (API-WEBHOOKS-001)
  # ============================================================
  - operation_id: OP-list-subscriptions
    ui_location: WebhooksPanel/SubscriptionList
    description: List webhook subscriptions
    api_equivalents:
      - surface: rest
        method: GET
        path: "/api/v1/webhooks"
    coverage_status: covered

  - operation_id: OP-create-subscription
    ui_location: WebhooksPanel/CreateSubscriptionModal
    description: Create webhook subscription for events
    api_equivalents:
      - surface: rest
        method: POST
        path: "/api/v1/webhooks"
    coverage_status: covered

  - operation_id: OP-delete-subscription
    ui_location: WebhooksPanel/SubscriptionContextMenu
    description: Delete webhook subscription
    api_equivalents:
      - surface: rest
        method: DELETE
        path: "/api/v1/webhooks/{subscriptionId}"
    coverage_status: covered

  # ============================================================
  # Access Control (AUTH-RBAC-001)
  # ============================================================
  - operation_id: OP-list-access-policies
    ui_location: AdminPanel/AccessPolicies
    description: List access control policies for ontology
    api_equivalents:
      - surface: rest
        method: GET
        path: "/api/v1/ontologies/{ontologyId}/policies"
    coverage_status: covered

  - operation_id: OP-create-access-policy
    ui_location: AdminPanel/CreatePolicyModal
    description: Create access policy for role/subject
    api_equivalents:
      - surface: rest
        method: POST
        path: "/api/v1/ontologies/{ontologyId}/policies"
    coverage_status: covered

  - operation_id: OP-delete-access-policy
    ui_location: AdminPanel/PolicyContextMenu
    description: Delete access policy
    api_equivalents:
      - surface: rest
        method: DELETE
        path: "/api/v1/ontologies/{ontologyId}/policies/{policyId}"
    coverage_status: covered

summary:
  total_operations: 38
  covered_count: 38
  missing_count: 0
  deferred_count: 0
  coverage_percent: 100.0
  last_updated: "2026-05-13"

# Coverage gate: 100% required before merge
# Set coverage_status to "covered" for each operation when API is implemented
