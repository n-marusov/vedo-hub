syntax = "proto3";

package vedo.shared.v1;

option go_package = "github.com/vedo-core/shared/v1;sharedv1";
option java_package = "com.vedo.core.shared.v1";
option java_multiple_files = true;

message UUID {
  string value = 1;
}

message Pagination {
  int32 page_size = 1;
  string page_token = 2;
  bool total_count = 3;
}

message RequestMetadata {
  string request_id = 1;
  string user_id = 2;
  string workspace_id = 3;
  int64 timestamp = 4;
  map<string, string> headers = 5;
}

message Error {
  int32 code = 1;
  string message = 2;
  string details = 3;
  string domain = 4;
  string reason = 5;
}

message PaginationResponse {
  int32 total_size = 1;
  string next_page_token = 2;
  bool has_more = 3;
}

message Empty {}

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}