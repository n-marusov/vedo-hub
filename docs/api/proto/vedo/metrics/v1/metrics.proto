syntax = "proto3";

package vedo.metrics.v1;

import "vedo/shared/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/vedo-core/metrics/v1;metricsv1";
option java_package = "com.vedo.core.metrics.v1";
option java_multiple_files = true;

service MetricsService {
  rpc RecordMetric(RecordMetricRequest) returns (RecordMetricResponse);
  rpc RecordBatchMetrics(RecordBatchMetricsRequest) returns (RecordBatchMetricsResponse);
  rpc QueryMetrics(QueryMetricsRequest) returns (QueryMetricsResponse);
  rpc GetMetricSummary(GetMetricSummaryRequest) returns (GetMetricSummaryResponse);
  rpc CreateAlert(CreateAlertRequest) returns (CreateAlertResponse);
  rpc ListAlerts(ListAlertsRequest) returns (ListAlertsResponse);
  rpc UpdateAlert(UpdateAlertRequest) returns (UpdateAlertResponse);
  rpc DeleteAlert(DeleteAlertRequest) returns (DeleteAlertResponse);
  rpc GetAlertHistory(GetAlertHistoryRequest) returns (GetAlertHistoryResponse);
}

message Metric {
  string name = 1;
  MetricType metric_type = 2;
  double value = 3;
  string unit = 4;
  map<string, string> labels = 5;
  google.protobuf.Timestamp timestamp = 6;
  string source = 7;
  string workspace_id = 8;
}

enum MetricType {
  METRIC_TYPE_UNSPECIFIED = 0;
  METRIC_TYPE_GAUGE = 1;
  METRIC_TYPE_COUNTER = 2;
  METRIC_TYPE_HISTOGRAM = 3;
  METRIC_TYPE_SUMMARY = 4;
  METRIC_TYPE_RATE = 5;
}

message MetricDataPoint {
  google.protobuf.Timestamp timestamp = 1;
  double value = 2;
  map<string, string> labels = 3;
}

message MetricSeries {
  string name = 1;
  MetricType metric_type = 2;
  string unit = 3;
  map<string, string> labels = 4;
  repeated MetricDataPoint data_points = 5;
  AggregateStats stats = 6;
}

message AggregateStats {
  double min = 1;
  double max = 2;
  double avg = 3;
  double sum = 4;
  int64 count = 5;
  double p50 = 6;
  double p90 = 7;
  double p95 = 8;
  double p99 = 9;
}

message Alert {
  string id = 1;
  string name = 2;
  string description = 3;
  string metric_name = 4;
  AlertCondition condition = 5;
  double threshold = 6;
  ComparisonOperator operator = 7;
  AlertStatus status = 8;
  AlertSeverity severity = 9;
  int32 evaluation_interval_seconds = 10;
  int32 cooldown_seconds = 11;
  repeated string notification_channels = 12;
  string workspace_id = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  google.protobuf.Timestamp last_triggered_at = 16;
  google.protobuf.Timestamp resolved_at = 17;
}

message AlertEvent {
  string id = 1;
  string alert_id = 2;
  AlertEventType event_type = 3;
  double metric_value = 4;
  string message = 5;
  google.protobuf.Timestamp triggered_at = 6;
}

enum AlertEventType {
  ALERT_EVENT_TYPE_UNSPECIFIED = 0;
  ALERT_EVENT_TYPE_TRIGGERED = 1;
  ALERT_EVENT_TYPE_RESOLVED = 2;
  ALERT_EVENT_TYPE_ACKNOWLEDGED = 3;
  ALERT_EVENT_TYPE_ESCLALATED = 4;
}

enum AlertCondition {
  ALERT_CONDITION_UNSPECIFIED = 0;
  ALERT_CONDITION_ABOVE = 1;
  ALERT_CONDITION_BELOW = 2;
  ALERT_CONDITION_EQUALS = 3;
  ALERT_CONDITION_CHANGES = 4;
  ALERT_CONDITION_NO_DATA = 5;
}

enum ComparisonOperator {
  COMPARISON_OPERATOR_UNSPECIFIED = 0;
  COMPARISON_OPERATOR_GT = 1;
  COMPARISON_OPERATOR_GTE = 2;
  COMPARISON_OPERATOR_LT = 3;
  COMPARISON_OPERATOR_LTE = 4;
  COMPARISON_OPERATOR_EQ = 5;
  COMPARISON_OPERATOR_NEQ = 6;
}

enum AlertStatus {
  ALERT_STATUS_UNSPECIFIED = 0;
  ALERT_STATUS_ACTIVE = 1;
  ALERT_STATUS_ACKNOWLEDGED = 2;
  ALERT_STATUS_RESOLVED = 3;
  ALERT_STATUS_SILENCED = 4;
}

enum AlertSeverity {
  ALERT_SEVERITY_UNSPECIFIED = 0;
  ALERT_SEVERITY_INFO = 1;
  ALERT_SEVERITY_WARNING = 2;
  ALERT_SEVERITY_CRITICAL = 3;
}

message RecordMetricRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  Metric metric = 2;
}

message RecordMetricResponse {
  vedo.shared.v1.Error error = 1;
  bool recorded = 2;
}

message RecordBatchMetricsRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  repeated Metric metrics = 2;
}

message RecordBatchMetricsResponse {
  vedo.shared.v1.Error error = 1;
  int32 recorded_count = 2;
}

message QueryMetricsRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  repeated string metric_names = 2;
  string workspace_id = 3;
  google.protobuf.Timestamp start_time = 4;
  google.protobuf.Timestamp end_time = 5;
  AggregationType aggregation = 6;
  int32 aggregation_interval_seconds = 7;
  map<string, string> labels_filter = 8;
  vedo.shared.v1.Pagination pagination = 9;
}

enum AggregationType {
  AGGREGATION_TYPE_UNSPECIFIED = 0;
  AGGREGATION_TYPE_NONE = 1;
  AGGREGATION_TYPE_AVG = 2;
  AGGREGATION_TYPE_SUM = 3;
  AGGREGATION_TYPE_MIN = 4;
  AGGREGATION_TYPE_MAX = 5;
  AGGREGATION_TYPE_COUNT = 6;
  AGGREGATION_TYPE_P50 = 7;
  AGGREGATION_TYPE_P90 = 8;
  AGGREGATION_TYPE_P95 = 9;
  AGGREGATION_TYPE_P99 = 10;
}

message QueryMetricsResponse {
  vedo.shared.v1.Error error = 1;
  repeated MetricSeries series = 2;
  vedo.shared.v1.PaginationResponse pagination = 3;
}

message GetMetricSummaryRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string metric_name = 2;
  string workspace_id = 3;
  google.protobuf.Timestamp start_time = 4;
  google.protobuf.Timestamp end_time = 5;
  map<string, string> labels_filter = 6;
}

message GetMetricSummaryResponse {
  vedo.shared.v1.Error error = 1;
  MetricSeries series = 2;
}

message CreateAlertRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  Alert alert = 2;
}

message CreateAlertResponse {
  vedo.shared.v1.Error error = 1;
  Alert alert = 2;
}

message ListAlertsRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string workspace_id = 2;
  AlertStatus status = 3;
  AlertSeverity severity = 4;
  vedo.shared.v1.Pagination pagination = 5;
}

message ListAlertsResponse {
  vedo.shared.v1.Error error = 1;
  repeated Alert alerts = 2;
  vedo.shared.v1.PaginationResponse pagination = 3;
}

message UpdateAlertRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  Alert alert = 2;
}

message UpdateAlertResponse {
  vedo.shared.v1.Error error = 1;
  Alert alert = 2;
}

message DeleteAlertRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string alert_id = 2;
}

message DeleteAlertResponse {
  vedo.shared.v1.Error error = 1;
}

message GetAlertHistoryRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string alert_id = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
  vedo.shared.v1.Pagination pagination = 5;
}

message GetAlertHistoryResponse {
  vedo.shared.v1.Error error = 1;
  repeated AlertEvent events = 2;
  vedo.shared.v1.PaginationResponse pagination = 3;
}