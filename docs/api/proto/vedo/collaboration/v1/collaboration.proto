syntax = "proto3";

package vedo.collaboration.v1;

import "vedo/shared/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/vedo-core/collaboration/v1;collaborationv1";
option java_package = "com.vedo.core.collaboration.v1";
option java_multiple_files = true;

service CollaborationService {
  rpc AcquireLock(AcquireLockRequest) returns (AcquireLockResponse);
  rpc ReleaseLock(ReleaseLockRequest) returns (ReleaseLockResponse);
  rpc GetLock(GetLockRequest) returns (GetLockResponse);
  rpc ListLocks(ListLocksRequest) returns (ListLocksResponse);
  rpc ExtendLock(ExtendLockRequest) returns (ExtendLockResponse);
  rpc ForceReleaseLock(ForceReleaseLockRequest) returns (ForceReleaseLockResponse);
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
  rpc GetComment(GetCommentRequest) returns (GetCommentResponse);
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  rpc UpdateComment(UpdateCommentRequest) returns (UpdateCommentResponse);
  rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse);
  rpc ResolveComment(ResolveCommentRequest) returns (ResolveCommentResponse);
  rpc SubscribeToComments(SubscribeToCommentsRequest) returns (stream CommentEvent);
  rpc SubscribeToLocks(SubscribeToLocksRequest) returns (stream LockEvent);
}

message Lock {
  string id = 1;
  string entity_type = 2;
  string entity_id = 3;
  string resource_path = 4;
  string owner_id = 5;
  string owner_name = 6;
  LockType lock_type = 7;
  LockStatus status = 8;
  google.protobuf.Timestamp acquired_at = 9;
  google.protobuf.Timestamp expires_at = 10;
  int32 ttl_seconds = 11;
  string session_id = 12;
  string metadata_json = 13;
}

enum LockType {
  LOCK_TYPE_UNSPECIFIED = 0;
  LOCK_TYPE_SHARED = 1;
  LOCK_TYPE_EXCLUSIVE = 2;
}

enum LockStatus {
  LOCK_STATUS_UNSPECIFIED = 0;
  LOCK_STATUS_ACTIVE = 1;
  LOCK_STATUS_RELEASED = 2;
  LOCK_STATUS_EXPIRED = 3;
}

message Comment {
  string id = 1;
  string entity_type = 2;
  string entity_id = 3;
  string content = 4;
  string author_id = 5;
  string author_name = 6;
  string parent_comment_id = 7;
  bool is_resolved = 8;
  bool is_deleted = 9;
  repeated string mention_ids = 10;
  repeated string tag_ids = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  google.protobuf.Timestamp deleted_at = 14;
}

message LockEvent {
  EventType event_type = 1;
  Lock lock = 2;
  string actor_id = 3;
  google.protobuf.Timestamp timestamp = 4;
}

message CommentEvent {
  EventType event_type = 1;
  Comment comment = 2;
  string actor_id = 3;
  google.protobuf.Timestamp timestamp = 4;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_CREATED = 1;
  EVENT_TYPE_UPDATED = 2;
  EVENT_TYPE_DELETED = 3;
  EVENT_TYPE_RESOLVED = 4;
  EVENT_TYPE_LOCK_ACQUIRED = 5;
  EVENT_TYPE_LOCK_RELEASED = 6;
  EVENT_TYPE_LOCK_EXPIRED = 7;
  EVENT_TYPE_LOCK_EXTENDED = 8;
}

message AcquireLockRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string entity_type = 2;
  string entity_id = 3;
  string resource_path = 4;
  LockType lock_type = 5;
  int32 ttl_seconds = 6;
  bool wait_for_release = 7;
  int32 timeout_seconds = 8;
}

message AcquireLockResponse {
  vedo.shared.v1.Error error = 1;
  Lock lock = 2;
  bool acquired = 3;
}

message ReleaseLockRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string lock_id = 2;
}

message ReleaseLockResponse {
  vedo.shared.v1.Error error = 1;
  bool released = 2;
}

message GetLockRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string lock_id = 2;
}

message GetLockResponse {
  vedo.shared.v1.Error error = 1;
  Lock lock = 2;
}

message ListLocksRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string entity_type = 2;
  string entity_id = 3;
  LockStatus status = 4;
  vedo.shared.v1.Pagination pagination = 5;
}

message ListLocksResponse {
  vedo.shared.v1.Error error = 1;
  repeated Lock locks = 2;
  vedo.shared.v1.PaginationResponse pagination = 3;
}

message ExtendLockRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string lock_id = 2;
  int32 additional_seconds = 3;
}

message ExtendLockResponse {
  vedo.shared.v1.Error error = 1;
  Lock lock = 2;
}

message ForceReleaseLockRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string lock_id = 2;
  string reason = 3;
}

message ForceReleaseLockResponse {
  vedo.shared.v1.Error error = 1;
}

message CreateCommentRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string entity_type = 2;
  string entity_id = 3;
  string content = 4;
  string parent_comment_id = 5;
  repeated string mention_ids = 6;
  repeated string tag_ids = 7;
}

message CreateCommentResponse {
  vedo.shared.v1.Error error = 1;
  Comment comment = 2;
}

message GetCommentRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string comment_id = 2;
}

message GetCommentResponse {
  vedo.shared.v1.Error error = 1;
  Comment comment = 2;
}

message ListCommentsRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string entity_type = 2;
  string entity_id = 3;
  string parent_comment_id = 4;
  bool include_resolved = 5;
  vedo.shared.v1.Pagination pagination = 6;
}

message ListCommentsResponse {
  vedo.shared.v1.Error error = 1;
  repeated Comment comments = 2;
  vedo.shared.v1.PaginationResponse pagination = 3;
}

message UpdateCommentRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string comment_id = 2;
  string content = 3;
}

message UpdateCommentResponse {
  vedo.shared.v1.Error error = 1;
  Comment comment = 2;
}

message DeleteCommentRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string comment_id = 2;
}

message DeleteCommentResponse {
  vedo.shared.v1.Error error = 1;
}

message ResolveCommentRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string comment_id = 2;
  bool resolved = 3;
}

message ResolveCommentResponse {
  vedo.shared.v1.Error error = 1;
  Comment comment = 2;
}

message SubscribeToCommentsRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string entity_type = 2;
  string entity_id = 3;
}

message SubscribeToLocksRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string entity_type = 2;
  string entity_id = 3;
}