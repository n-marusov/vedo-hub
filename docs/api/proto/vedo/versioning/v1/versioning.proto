syntax = "proto3";

package vedo.versioning.v1;

import "vedo/shared/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/vedo-core/versioning/v1;versioningv1";
option java_package = "com.vedo.core.versioning.v1";
option java_multiple_files = true;

service VersioningService {
  rpc CreateCommit(CreateCommitRequest) returns (CreateCommitResponse);
  rpc GetCommit(GetCommitRequest) returns (GetCommitResponse);
  rpc ListCommits(ListCommitsRequest) returns (ListCommitsResponse);
  rpc GetCommitDiff(GetCommitDiffRequest) returns (GetCommitDiffResponse);
  rpc CreateBranch(CreateBranchRequest) returns (CreateBranchResponse);
  rpc GetBranch(GetBranchRequest) returns (GetBranchResponse);
  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse);
  rpc DeleteBranch(DeleteBranchRequest) returns (DeleteBranchResponse);
  rpc MergeBranches(MergeBranchesRequest) returns (MergeBranchesResponse);
  rpc GetMergeStatus(GetMergeStatusRequest) returns (GetMergeStatusResponse);
}

message Commit {
  string id = 1;
  string branch_id = 2;
  string message = 3;
  string author_id = 4;
  string parent_id = 5;
  repeated string parent_ids = 6;
  CommitType commit_type = 7;
  map<string, Change> changes = 8;
  string checksum = 9;
  google.protobuf.Timestamp committed_at = 10;
  google.protobuf.Timestamp created_at = 11;
}

enum CommitType {
  COMMIT_TYPE_UNSPECIFIED = 0;
  COMMIT_TYPE_INITIAL = 1;
  COMMIT_TYPE_NORMAL = 2;
  COMMIT_TYPE_MERGE = 3;
  COMMIT_TYPE_REVERT = 4;
}

message Change {
  ChangeType change_type = 1;
  string entity_type = 2;
  string entity_id = 3;
  string previous_version = 4;
  string current_version = 5;
  bytes diff = 6;
}

enum ChangeType {
  CHANGE_TYPE_UNSPECIFIED = 0;
  CHANGE_TYPE_CREATE = 1;
  CHANGE_TYPE_UPDATE = 2;
  CHANGE_TYPE_DELETE = 3;
}

message Branch {
  string id = 1;
  string name = 2;
  string head_commit_id = 3;
  bool is_protected = 4;
  string base_branch_id = 5;
  string created_by = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message MergeRequest {
  string id = 1;
  string source_branch_id = 2;
  string target_branch_id = 3;
  string author_id = 4;
  MergeStatus status = 5;
  repeated string commit_ids = 6;
  repeated Conflict conflicts = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp completed_at = 9;
}

enum MergeStatus {
  MERGE_STATUS_UNSPECIFIED = 0;
  MERGE_STATUS_PENDING = 1;
  MERGE_STATUS_IN_PROGRESS = 2;
  MERGE_STATUS_MERGED = 3;
  MERGE_STATUS_CONFLICT = 4;
  MERGE_STATUS_FAILED = 5;
}

message Conflict {
  string entity_type = 1;
  string entity_id = 2;
  bytes source_version = 3;
  bytes target_version = 4;
  bytes base_version = 5;
}

message CreateCommitRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string branch_id = 2;
  string message = 3;
  repeated Change changes = 4;
}

message CreateCommitResponse {
  vedo.shared.v1.Error error = 1;
  Commit commit = 2;
}

message GetCommitRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string commit_id = 2;
}

message GetCommitResponse {
  vedo.shared.v1.Error error = 1;
  Commit commit = 2;
}

message ListCommitsRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string branch_id = 2;
  string from_commit_id = 3;
  int32 limit = 4;
  vedo.shared.v1.Pagination pagination = 5;
}

message ListCommitsResponse {
  vedo.shared.v1.Error error = 1;
  repeated Commit commits = 2;
  vedo.shared.v1.PaginationResponse pagination = 3;
}

message GetCommitDiffRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string commit_id = 2;
  string base_commit_id = 3;
}

message GetCommitDiffResponse {
  vedo.shared.v1.Error error = 1;
  Commit commit = 2;
  repeated Change changes = 3;
}

message CreateBranchRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string name = 2;
  string base_branch_id = 3;
  bool is_protected = 4;
}

message CreateBranchResponse {
  vedo.shared.v1.Error error = 1;
  Branch branch = 2;
}

message GetBranchRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string branch_id = 2;
}

message GetBranchResponse {
  vedo.shared.v1.Error error = 1;
  Branch branch = 2;
}

message ListBranchesRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string base_branch_id = 2;
  vedo.shared.v1.Pagination pagination = 3;
}

message ListBranchesResponse {
  vedo.shared.v1.Error error = 1;
  repeated Branch branches = 2;
  vedo.shared.v1.PaginationResponse pagination = 3;
}

message DeleteBranchRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string branch_id = 2;
}

message DeleteBranchResponse {
  vedo.shared.v1.Error error = 1;
}

message MergeBranchesRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string source_branch_id = 2;
  string target_branch_id = 3;
  CommitType merge_commit_type = 4;
}

message MergeBranchesResponse {
  vedo.shared.v1.Error error = 1;
  MergeRequest merge_request = 2;
  Commit commit = 3;
}

message GetMergeStatusRequest {
  vedo.shared.v1.RequestMetadata metadata = 1;
  string merge_request_id = 2;
}

message GetMergeStatusResponse {
  vedo.shared.v1.Error error = 1;
  MergeRequest merge_request = 2;
}