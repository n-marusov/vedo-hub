"""
VEDO Core GraphQL Schema

Frontend-specific data access via GraphQL.
Provides read/write operations for ontology entities, versioning, collaboration, and search.
ErrorContractMapper ensures stable error codes across all operations.
"""

scalar UUID
scalar DateTime
scalar JSON

enum OntologyEntityType {
  Class
  ObjectProperty
  DatatypeProperty
  Individual
}

enum Permission {
  read
  write
  review
  admin
}

enum SubjectType {
  user
  group
  service_account
  originator
}

enum XSDType {
  string
  boolean
  integer
  double
  date
  dateTime
}

enum EdgeType {
  SUBCLASS_OF
  DOMAIN
  RANGE
  OBJECT_PROPERTY
}

enum LockStatus {
  active
  expired
  released
}

enum VisibilityLevel {
  public
  team
  reviewers_only
  private
}

enum UserRole {
  viewer
  editor
  reviewer
  admin
  service
}

enum SearchMatchType {
  id
  label
  comment
  property
}

enum AuthorizationDecision {
  allow
  deny
  review_required
}

type Ontology {
  id: UUID!
  name: String!
  createdAt: DateTime!
  version: String!
}

type Class {
  id: ID!
  label: JSON!
  comment: JSON
  parents: [ID!]!
  isAbstract: Boolean!
  isDeprecated: Boolean!
  createdAt: DateTime!
}

type ObjectProperty {
  id: ID!
  label: JSON!
  comment: JSON
  domain: [ID!]!
  range: [ID!]!
  characteristics: PropertyCharacteristics
  inverseOf: ID
}

type DatatypeProperty {
  id: ID!
  label: JSON!
  comment: JSON
  domain: [ID!]!
  range: XSDType!
  multilingual: Boolean!
}

type Individual {
  id: ID!
  label: JSON!
  types: [ID!]!
  properties: JSON
  deprecated: Boolean!
}

type Author {
  userId: String!
  displayName: String
}

type Commit {
  id: UUID!
  ontologyId: UUID!
  branchId: String!
  message: String!
  author: Author!
  timestamp: DateTime!
  parentIds: [UUID!]!
  stats: CommitStats!
}

type CommitStats {
  nodesAdded: Int!
  nodesRemoved: Int!
  nodesModified: Int!
}

type Branch {
  id: ID!
  name: String!
  ontologyId: UUID!
  head: String
  isProtected: Boolean!
  createdAt: DateTime!
  createdBy: String
}

type Lock {
  lockId: UUID!
  nodeId: ID!
  nodeType: OntologyEntityType!
  userId: String!
  expiresAt: DateTime!
  status: LockStatus!
}

type Comment {
  id: UUID!
  nodeId: ID!
  nodeType: OntologyEntityType!
  content: String!
  visibility: VisibilityLevel!
  author: Author!
  createdAt: DateTime!
  updatedAt: DateTime
  parentId: UUID
  mentions: [String!]!
  viewCount: Int!
  viewedBy: [String!]!
}

type TreeNode {
  id: ID!
  label: JSON!
  type: OntologyEntityType!
  children: [TreeNode!]!
}

type GraphNode {
  id: ID!
  label: String!
  type: OntologyEntityType!
  isAbstract: Boolean!
  isDeprecated: Boolean!
}

type GraphEdge {
  source: ID!
  target: ID!
  type: EdgeType!
}

type GraphView {
  tree: TreeNode!
  nodes: [GraphNode!]!
  edges: [GraphEdge!]!
}

type SearchResult {
  id: ID!
  type: OntologyEntityType!
  label: JSON!
  match: SearchMatchType!
  score: Float!
}

type SearchResponse {
  results: [SearchResult!]!
  total: Int!
}

type OntologyMetrics {
  ontologyId: UUID!
  timestamp: DateTime!
  classCount: Int!
  objectPropertyCount: Int!
  datatypePropertyCount: Int!
  individualCount: Int!
  axiomCount: Int!
  maxClassDepth: Int!
  avgClassChildren: Float!
  branchingFactor: Float!
  individualsPerClass: Float!
}

type PropertyCharacteristics {
  transitive: Boolean!
  symmetric: Boolean!
  functional: Boolean!
}

type User {
  id: String!
  displayName: String!
  email: String!
  role: UserRole!
}

type AuthContext {
  subjectId: String!
  subjectType: SubjectType!
  tenantId: String!
  permissions: [Permission!]!
  role: UserRole!
}

type AuthorizationResult {
  decision: AuthorizationDecision!
  effectivePermissions: [Permission!]!
  reason: String
}

type Error {
  code: String!
  message: String!
  field: String
  details: JSON
}

type ImportResult {
  success: Boolean!
  format: String!
  fileSize: Int!
  tripleCount: Int!
  commitId: UUID
  errors: [ImportError!]!
}

type ImportError {
  code: String!
  line: Int!
  message: String!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type ClassConnection {
  nodes: [Class!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type PropertyConnection {
  nodes: [ObjectProperty!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type IndividualConnection {
  nodes: [Individual!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CommitConnection {
  nodes: [Commit!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CommentConnection {
  nodes: [Comment!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type LockConnection {
  nodes: [Lock!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type MutationResult {
  success: Boolean!
  id: ID
  version: String
}

type DeleteResult {
  success: Boolean!
  deleted: Boolean!
}

type BranchResult {
  id: ID!
  name: String!
  ontologyId: UUID!
  head: String
  createdAt: DateTime!
}

type MergeResult {
  commitId: UUID!
  mergeType: String!
  conflicts: [String!]!
}

input LocalizedString {
  locale: String!
  value: String!
}

input CreateClassInput {
  id: ID
  label: JSON!
  comment: JSON
  parents: [ID!] = []
  isAbstract: Boolean = false
  deprecated: Boolean = false
  branchId: String!
  expectedHeadCommitId: String!
  lockId: String
  commitMessage: String!
}

input UpdateClassInput {
  label: JSON
  comment: JSON
  parents: [ID!]
  isAbstract: Boolean
  deprecated: Boolean
  branchId: String!
  expectedHeadCommitId: String!
  lockId: String!
  commitMessage: String!
}

input CreatePropertyInput {
  id: ID
  label: JSON!
  comment: JSON
  propertyType: OntologyEntityType = ObjectProperty
  domain: [ID!]!
  range: JSON!
  characteristics: PropertyCharacteristicsInput
  inverseOf: ID
  multilingual: Boolean = false
  branchId: String!
  expectedHeadCommitId: String!
  lockId: String
  commitMessage: String!
}

input UpdatePropertyInput {
  label: JSON
  comment: JSON
  domain: [ID!]
  range: JSON
  characteristics: PropertyCharacteristicsInput
  inverseOf: ID
  multilingual: Boolean
  branchId: String!
  expectedHeadCommitId: String!
  lockId: String!
  commitMessage: String!
}

input ObjectPropertyValues {
  propertyId: ID!
  targetIndividualIds: [ID!]!
}

input DatatypePropertyValues {
  propertyId: ID!
  value: JSON!
}

input PropertyValues {
  objectProperty: [ObjectPropertyValues!]
  datatypeProperty: [DatatypePropertyValues!]
}

input CreateIndividualInput {
  id: ID
  label: JSON!
  comment: JSON
  types: [ID!]!
  properties: PropertyValues
  deprecated: Boolean = false
  branchId: String!
  expectedHeadCommitId: String!
  lockId: String
  commitMessage: String!
}

input UpdateIndividualInput {
  label: JSON
  comment: JSON
  types: [ID!]
  properties: PropertyValues
  deprecated: Boolean
  branchId: String!
  expectedHeadCommitId: String!
  lockId: String!
  commitMessage: String!
}

input LockInput {
  nodeId: ID!
  nodeType: OntologyEntityType!
  duration: Int = 300
}

input CommentInput {
  nodeId: ID!
  nodeType: OntologyEntityType!
  content: String!
  visibility: VisibilityLevel = public
  parentId: UUID
  mentions: [String!] = []
}

input UpdateCommentInput {
  content: String!
  visibility: VisibilityLevel
}

input SearchInput {
  query: String!
  types: [OntologyEntityType!]
  language: String
  limit: Int = 20
  propertyFilters: JSON
}

input CommitInput {
  branchId: String!
  expectedHeadCommitId: String!
  message: String!
  lockIds: [UUID!]
  parentIds: [UUID!]
}

input BranchInput {
  name: String!
  sourceBranch: String
  isProtected: Boolean = false
}

input MergeInput {
  sourceBranch: String!
  targetBranch: String!
  message: String!
}

input ImportInput {
  content: String!
  format: String!
  mode: String = merge
  branchId: String!
  expectedHeadCommitId: String!
}

input ExportInput {
  format: String = turtle
  compression: String = none
  branchId: String!
}

input PaginationInput {
  first: Int = 50
  after: String
  last: Int
  before: String
}

input ClassOrderBy {
  field: String! = createdAt
  direction: String! = desc
}

input PropertyOrderBy {
  field: String! = createdAt
  direction: String! = desc
}

input IndividualOrderBy {
  field: String! = createdAt
  direction: String! = desc
}

input CommitOrderBy {
  field: String! = timestamp
  direction: String! = desc
}

type Query {
  ontology(id: UUID!): Ontology

  graph(ontologyId: UUID!, depth: Int = 3, focusClassId: ID): GraphView!

  class_(ontologyId: UUID!, id: ID!): Class

  classes(
    ontologyId: UUID!
    pagination: PaginationInput
    orderBy: ClassOrderBy
    deprecated: Boolean = false
  ): ClassConnection!

  objectProperty(ontologyId: UUID!, id: ID!): ObjectProperty

  datatypeProperty(ontologyId: UUID!, id: ID!): DatatypeProperty

  properties(
    ontologyId: UUID!
    type: OntologyEntityType
    pagination: PaginationInput
    orderBy: PropertyOrderBy
  ): PropertyConnection!

  individual(ontologyId: UUID!, id: ID!): Individual

  individuals(
    ontologyId: UUID!
    classId: ID
    pagination: PaginationInput
    orderBy: IndividualOrderBy
    deprecated: Boolean = false
  ): IndividualConnection!

  search(ontologyId: UUID!, input: SearchInput!): SearchResponse!

  commits(
    ontologyId: UUID!
    branchId: String!
    pagination: PaginationInput
    orderBy: CommitOrderBy
  ): CommitConnection!

  commit(ontologyId: UUID!, id: UUID!): Commit

  branches(ontologyId: UUID!): [Branch!]!

  branch(ontologyId: UUID!, name: String!): Branch

  comments(
    ontologyId: UUID!
    nodeId: ID
    nodeType: OntologyEntityType
    visibility: VisibilityLevel
    pagination: PaginationInput
  ): CommentConnection!

  locks(ontologyId: UUID!, nodeId: ID): LockConnection!

  metrics(ontologyId: UUID!): OntologyMetrics!

  checkAccess(
    subjectId: String!
    subjectType: SubjectType = user
    ontologyId: UUID!
    classId: ID
    attributeId: ID
    permission: Permission!
  ): AuthorizationResult!

  me: User!
}

type Mutation {
  createClass(ontologyId: UUID!, input: CreateClassInput!): MutationResult!
  updateClass(ontologyId: UUID!, id: ID!, input: UpdateClassInput!): MutationResult!
  deleteClass(ontologyId: UUID!, id: ID!, branchId: String!, expectedHeadCommitId: String!, lockId: String!, commitMessage: String!): DeleteResult!
  moveClass(ontologyId: UUID!, id: ID!, newParents: [ID!]!, branchId: String!, expectedHeadCommitId: String!, lockId: String!, commitMessage: String!): MutationResult!

  createProperty(ontologyId: UUID!, input: CreatePropertyInput!): MutationResult!
  updateProperty(ontologyId: UUID!, id: ID!, input: UpdatePropertyInput!): MutationResult!
  deleteProperty(ontologyId: UUID!, id: ID!, branchId: String!, expectedHeadCommitId: String!, lockId: String!, commitMessage: String!): DeleteResult!

  createIndividual(ontologyId: UUID!, input: CreateIndividualInput!): MutationResult!
  updateIndividual(ontologyId: UUID!, id: ID!, input: UpdateIndividualInput!): MutationResult!
  deleteIndividual(ontologyId: UUID!, id: ID!, branchId: String!, expectedHeadCommitId: String!, lockId: String!, commitMessage: String!): DeleteResult!

  acquireLock(ontologyId: UUID!, input: LockInput!): Lock!
  releaseLock(ontologyId: UUID!, lockId: UUID!): Lock!

  createComment(ontologyId: UUID!, input: CommentInput!): Comment!
  updateComment(ontologyId: UUID!, id: UUID!, input: UpdateCommentInput!): Comment!
  deleteComment(ontologyId: UUID!, id: UUID!): DeleteResult!
  markCommentViewed(ontologyId: UUID!, id: UUID!): Comment!

  createCommit(ontologyId: UUID!, input: CommitInput!): Commit!

  createBranch(ontologyId: UUID!, input: BranchInput!): BranchResult!
  deleteBranch(ontologyId: UUID!, name: String!): DeleteResult!

  mergeBranches(ontologyId: UUID!, input: MergeInput!): MergeResult!

  importOntology(ontologyId: UUID!, input: ImportInput!): ImportResult!
  exportOntology(ontologyId: UUID!, input: ExportInput!): String!
}

type Subscription {
  treeUpdated(ontologyId: UUID!, branchId: String): TreeNode!
  nodeChanged(ontologyId: UUID!, nodeId: ID, nodeType: OntologyEntityType): GraphNode!
  lockEvent(ontologyId: UUID!, nodeId: ID): Lock!
  commentEvent(ontologyId: UUID!, nodeId: ID): Comment!
  ontologyUpdated(ontologyId: UUID!): Ontology!
}
