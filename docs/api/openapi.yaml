openapi: 3.1.0
info:
  title: VEDO Core REST API
  version: 1.0.0
  description: |
    REST API управления онтологиями VEDO Core, предоставляющий полный набор операций CRUD
    для онтологий, классов, свойств, индивидов, версионирования (коммиты, ветки),
    поиска, импорта/экспорта, веб-хуков, политик доступа и администрирования.

    Все эндпоинты требуют аутентификации JWT Bearer, если не отмечены как публичные.

    ## Версионирование
    Данный API следует семантическому версионированию с указанием мажорных версий в пути.
    Текущая версия: v1
    Ломающие изменения будут вводиться в новых мажорных версиях с предупреждениями
    об устаревании, возвращаемыми в заголовках ответа.

    ## Ограничения скорости
    Стандартные эндпоинты: 1000 запросов/минуту
    Импорт эндпоинты: 5 запросов/час
    Экспорт эндпоинты: 20 запросов/час
    SPARQL эндпоинт: 10 запросов/минуту
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://api.vedo-core.example.com/api/v1
    description: Прод сервер
  - url: http://http://localhost:8080/api/v1
    description: Тестовый сервер

tags:
  - name: ontologies
    description: Управление онтологиями
  - name: classes
    description: Управление классами (TBox)
  - name: properties
    description: Управление свойствами (ObjectProperty, DatatypeProperty)
  - name: individuals
    description: Управление индивидами (ABox)
  - name: graph
    description: Просмотр и навигация по графу
  - name: search
    description: Поисковые операции
  - name: commits
    description: Коммиты системы контроля версий
  - name: branches
    description: Ветки системы контроля версий
  - name: locks
    description: Блокировка узлов для совместной работы
  - name: import-export
    description: RDF импорт и экспорт
  - name: webhooks
    description: Подписки на веб-хуки
  - name: access-policies
    description: Политики доступа RBAC
  - name: admin
    description: Операции администрирования

paths:
  /ontologies:
    get:
      tags: [ontologies]
      operationId: listOntologies
      summary: Получить список онтологий
      description: Возвращает пагинированный список онтологий, доступных аутентифицированному пользователю.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived]
      responses:
        '200':
          description: Успешный ответ
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OntologyListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
    post:
      tags: [ontologies]
      operationId: createOntology
      summary: Создать онтологию
      description: Создаёт новую онтологию с указанной конфигурацией.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOntologyRequest'
      responses:
        '201':
          description: Онтология создана
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ontology'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ResourceConflict'

  /ontologies/{ontologyId}:
    parameters:
      - $ref: '#/components/parameters/ontologyId'
    get:
      tags: [ontologies]
      operationId: getOntology
      summary: Получить онтологию по ID
      description: Возвращает полную информацию об онтологии, включая метаданные, статус и временные метки создания и обновления. Используйте ETag для оптимистичного параллелизма при последующих обновлениях.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешный ответ
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ontology'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    put:
      tags: [ontologies]
      operationId: updateOntology
      summary: Обновить онтологию
      description: Обновляет метаданные онтологии. Не влияет на содержимое TBox/ABox.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOntologyRequest'
      responses:
        '200':
          description: Онтология обновлена
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ontology'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
    delete:
      tags: [ontologies]
      operationId: deleteOntology
      summary: Удалить онтологию
      description: Мягко удаляет онтологию. Данные сохраняются согласно политике хранения.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Онтология удалена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

  /ontologies/{ontologyId}/graph:
    parameters:
      - $ref: '#/components/parameters/ontologyId'
    get:
      tags: [graph]
      operationId: getOntologyGraph
      summary: Получить структуру графа онтологии
      description: Возвращает дерево, узлы и рёбра для визуализации графа.
      security:
        - bearerAuth: []
      parameters:
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 3
        - name: focusClassId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Данные графа
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OntologyGraph'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

  /ontologies/{ontologyId}/tree:
    parameters:
      - $ref: '#/components/parameters/ontologyId'
    get:
      tags: [graph]
      operationId: getOntologyTree
      summary: Получить дерево иерархии классов
      description: Возвращает иерархическую древовидную структуру связей классов.
      security:
        - bearerAuth: []
      parameters:
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 3
        - name: showDeprecated
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Структура дерева
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassTreeNode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

  /ontologies/{ontologyId}/classes:
    parameters:
      - $ref: '#/components/parameters/ontologyId'
    get:
      tags: [classes]
      operationId: listClasses
      summary: Получить список классов онтологии
      description: Возвращает пагинированный список классов с фильтрацией по ветке, родительскому классу, абстрактности и статусу устаревания. Результаты отсортированы по умолчанию по дате создания в порядке убывания.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: branchId
          in: query
          schema:
            type: string
        - name: parentId
          in: query
          schema:
            type: string
        - name: isAbstract
          in: query
          schema:
            type: boolean
        - name: deprecated
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Список классов
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    post:
      tags: [classes]
      operationId: createClass
      summary: Создать класс
      description: Создаёт новый класс в TBox онтологии. Автоматически создаёт коммит.
      security:
        - bearerAuth: []
      parameters:
        - name: branchId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClassRequest'
      responses:
        '201':
          description: Класс создан
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Class'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '423':
          $ref: '#/components/responses/LockRequired'

  /ontologies/{ontologyId}/classes/{classId}:
    parameters:
      - $ref: '#/components/parameters/ontologyId'
      - $ref: '#/components/parameters/classId'
    get:
      tags: [classes]
      operationId: getClass
      summary: Получить класс по ID
      description: Возвращает детальную информацию о классе, включая локализованные метки, комментарии, родительские классы и временные метки. Учитывайте параметр If-None-Match для кэширования с использованием ETag.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Детали класса
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Class'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    put:
      tags: [classes]
      operationId: updateClass
      summary: Обновить класс
      description: Обновляет свойства класса. Автоматически создаёт коммит.
      security:
        - bearerAuth: []
      parameters:
        - name: branchId
          in: query
          required: true
          schema:
            type: string
        - name: expectedHeadCommitId
          in: query
          schema:
            type: string
        - name: lockId
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClassRequest'
      responses:
        '200':
          description: Класс обновлён
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Class'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '423':
          $ref: '#/components/responses/LockRequired'
    delete:
      tags: [classes]
      operationId: deleteClass
      summary: Удалить класс
      description: Удаляет класс. Требуется, чтобы индивиды этого класса отсутствовали.
      security:
        - bearerAuth: []
      parameters:
        - name: branchId
          in: query
          required: true
          schema:
            type: string
        - name: expectedHeadCommitId
          in: query
          schema:
            type: string
        - name: lockId
          in: query
          schema:
            type: string
      responses:
        '204':
          description: Класс удалён
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '423':
          $ref: '#/components/responses/LockRequired'

  /ontologies/{ontologyId}/properties:
    parameters:
      - $ref: '#/components/parameters/ontologyId'
    get:
      tags: [properties]
      operationId: listProperties
      summary: Получить список свойств онтологии
      description: Возвращает пагинированный список свойств с фильтрацией по типу (ObjectProperty, DatatypeProperty) и области определения (domainClassId). Поддерживает фильтрацию по ветке для многоуровневых онтологий.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: branchId
          in: query
          schema:
            type: string
        - name: propertyType
          in: query
          schema:
            type: string
            enum: [ObjectProperty, DatatypeProperty]
        - name: domainClassId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Список свойств
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    post:
      tags: [properties]
      operationId: createProperty
      summary: Создать свойство
      description: Создаёт ObjectProperty или DatatypeProperty. Автоматически создаёт коммит.
      security:
        - bearerAuth: []
      parameters:
        - name: branchId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePropertyRequest'
      responses:
        '201':
          description: Свойство создано
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '423':
          $ref: '#/components/responses/LockRequired'

  /ontologies/{ontologyId}/properties/{propertyId}:
    parameters:
      - $ref: '#/components/parameters/ontologyId'
      - $ref: '#/components/parameters/propertyId'
    get:
      tags: [properties]
      operationId: getProperty
      summary: Получить свойство по ID
      description: Возвращает полную информацию о свойстве, включая тип (ObjectProperty/DatatypeProperty), область определения, диапазон значений, характеристики (транзитивность, симметричность, функциональность) и обратное свойство.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Детали свойства
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    put:
      tags: [properties]
      operationId: updateProperty
      summary: Обновить свойство
      description: Обновляет определение свойства. Автоматически создаёт коммит.
      security:
        - bearerAuth: []
      parameters:
        - name: branchId
          in: query
          required: true
          schema:
            type: string
        - name: expectedHeadCommitId
          in: query
          schema:
            type: string
        - name: lockId
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePropertyRequest'
      responses:
        '200':
          description: Свойство обновлено
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '423':
          $ref: '#/components/responses/LockRequired'
    delete:
      tags: [properties]
      operationId: deleteProperty
      summary: Удалить свойство
      description: Удаляет свойство без возможности восстановления. Операция требует обязательного параметра branchId. Если свойство используется индивидами, удаление будет заблокировано с ошибкой 409. Для полного удаления может потребоваться снятие блокировки с параметром lockId.
      security:
        - bearerAuth: []
      parameters:
        - name: branchId
          in: query
          required: true
          schema:
            type: string
        - name: expectedHeadCommitId
          in: query
          schema:
            type: string
        - name: lockId
          in: query
          schema:
            type: string
      responses:
        '204':
          description: Свойство удалено
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '423':
          $ref: '#/components/responses/LockRequired'

  /ontologies/{ontologyId}/individuals:
    parameters:
      - $ref: '#/components/parameters/ontologyId'
    get:
      tags: [individuals]
      operationId: listIndividuals
      summary: Получить список индивидов онтологии
      description: Возвращает пагинированный список индивидов с фильтрацией по классу и статусу устаревания. Индивиды — это экземпляры классов со значениями свойств. Поддерживает фильтрацию по ветке.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: branchId
          in: query
          schema:
            type: string
        - name: classId
          in: query
          schema:
            type: string
        - name: deprecated
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Список индивидов
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndividualListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    post:
      tags: [individuals]
      operationId: createIndividual
      summary: Создать индивид
      description: Создаёт экземпляр класса со значениями свойств. Автоматически создаёт коммит.
      security:
        - bearerAuth: []
      parameters:
        - name: branchId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIndividualRequest'
      responses:
        '201':
          description: Индивид создан
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
