      description: Обновляет конфигурацию существующей подписки. Можно изменить целевой URL, список событий и статус активности. Изменение активности влияет на доставку уведомлений немедленно.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookSubscriptionRequest'
      responses:
        '200':
          description: Подписка обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    delete:
      tags: [webhooks]
      operationId: deleteWebhookSubscription
      summary: Удалить подписку на веб-хук
      description: Удаляет подписку без возможности восстановления. Все ожидающие уведомления будут отменены. Рекомендуется сначала деактивировать подписку (active=false) для плавного завершения перед удалением.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Подписка удалена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

  /access-policies:
    get:
      tags: [access-policies]
      operationId: listAccessPolicies
      summary: Получить список политик доступа
      description: Возвращает политики доступа для тенанта.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Список политик доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicyListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [access-policies]
      operationId: createAccessPolicy
      summary: Создать политику доступа
      description: Создаёт новую политику доступа RBAC.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessPolicyRequest'
      responses:
        '201':
          description: Политика доступа создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicy'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /access-policies/{policyId}:
    parameters:
      - name: policyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [access-policies]
      operationId: getAccessPolicy
      summary: Получить политику доступа
      description: Возвращает детальную информацию о политике доступа, включая субъект (пользователь, группа, сервисный аккаунт), область действия (онтология, класс, атрибут), разрешения и роль. Используйте для проверки прав доступа конкретного субъекта.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Детали политики доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    put:
      tags: [access-policies]
      operationId: updateAccessPolicy
      summary: Обновить политику доступа
      description: Обновляет разрешения и/или роль существующей политики доступа. Изменения вступают в силу немедленно и влияют на доступ субъекта к указанным ресурсам. Удалите политику и создайте новую для изменения области действия.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccessPolicyRequest'
      responses:
        '200':
          description: Политика доступа обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicy'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    delete:
      tags: [access-policies]
      operationId: deleteAccessPolicy
      summary: Удалить политику доступа
      description: Удаляет политику доступа без возможности восстановления. Субъект немедленно теряет доступ, предоставленный этой политикой. Рекомендуется сначала проверить, что субъект не нуждается в доступе, так как удаление необратимо.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Политика доступа удалена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

  /admin/access-points:
    post:
      tags: [admin]
      operationId: createAccessPoint
      summary: Создать точку доступа
      description: Создает новую точку доступа для тенанта.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessPointRequest'
      responses:
        '201':
          description: Точка доступа создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/storage-bindings:
    post:
      tags: [admin]
      operationId: bindStorage
      summary: Привязать хранилище
      description: Привязывает физическое хранилище к тенанту.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindStorageRequest'
      responses:
        '201':
          description: Хранилище привязано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/quotas:
    get:
      tags: [admin]
      operationId: getQuota
      summary: Получить квоту тенанта
      description: Возвращает текущие квоты ресурсов для указанного тенанта. Квоты включают ограничения на хранилище, вычисления, количество объектов и другие ресурсы.
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Текущие квоты тенанта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quota'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    put:
      tags: [admin]
      operationId: setQuota
      summary: Установить квоту тенанта
      description: Устанавливает или обновляет квоты ресурсов для указанного тенанта. При установке квоты все существующие ограничения перезаписываются.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetQuotaRequest'
      responses:
        '200':
          description: Квота обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/backup-policy:
    get:
      tags: [admin]
      operationId: getBackupPolicy
      summary: Получить политику резервного копирования
      description: Возвращает текущую конфигурацию резервного копирования.
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Политика резервного копирования
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    put:
      tags: [admin]
      operationId: configureBackupPolicy
      summary: Настроить политику резервного копирования
      description: Обновляет параметры резервного копирования.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureBackupPolicyRequest'
      responses:
        '200':
          description: Политика резервного копирования настроена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Аутентификация JWT Bearer токеном. Обязательна для всех эндпоинтов.

  headers:
    X-RateLimit-Limit:
      description: Максимальное количество запросов за период
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Оставшиеся запросы в текущем периоде
      schema:
        type: integer
    X-RateLimit-Reset:
      description: Unix timestamp сброса ограничения скорости
      schema:
        type: integer
    ETag:
      description: Тег сущности для кэширования
      schema:
        type: string

  parameters:
    ontologyId:
      name: ontologyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Идентификатор онтологии
    classId:
      name: classId
      in: path
      required: true
      schema:
        type: string
      description: Идентификатор класса
    propertyId:
      name: propertyId
      in: path
      required: true
      schema:
        type: string
      description: Идентификатор свойства
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Номер страницы
    pageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      description: Размер страницы

  responses:
    Unauthorized:
      description: Требуется аутентификация или токен недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorUnauthorized'
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorForbidden'
    ResourceNotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResourceNotFound'
    ResourceConflict:
      description: Конфликт ресурсов
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResourceConflict'
    ValidationError:
      description: Неверные данные запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorValidation'
    RateLimitExceeded:
      description: Превышен лимит запросов
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRateLimit'
    LockRequired:
      description: Для операции требуется блокировка
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorLockRequired'
    PayloadTooLarge:
      description: Тело запроса слишком большое
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayloadTooLarge'

  schemas:
    MultilingualLabel:
      type: object
      additionalProperties:
        type: string
      description: "Локализованные метки {ru: 'Текст', en: 'Text'}"

    MultilingualComment:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
      description: Локализованные комментарии по языкам

    PaginationMeta:
      type: object
      description: Метаданные пагинации
      properties:
        total:
          type: integer
          description: Всего записей
        page:
          type: integer
          description: Текущая страница
        pageSize:
          type: integer
          description: Размер страницы
        nextPage:
          type: string
          format: uri
          description: URL следующей страницы

    Ontology:
      type: object
      description: Онтология — контейнер для классов, свойств и индивидов
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор онтологии
        name:
          type: string
          description: Название
        description:
          type: string
          description: Описание
        status:
          type: string
          enum: [active, archived]
          description: Статус
        createdAt:
          type: string
          format: date-time
          description: Дата создания
        updatedAt:
          type: string
          format: date-time
          description: Дата обновления
        version:
          type: string
          description: Версия

    OntologyListResponse:
      type: object
      description: Ответ со списком онтологий и пагинацией
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Ontology'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    CreateOntologyRequest:
      type: object
      required: [name]
      description: Запрос на создание онтологии
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Название онтологии
        description:
          type: string
          description: Описание
        baseUri:
          type: string
          format: uri
          description: Базовый URI

    UpdateOntologyRequest:
      type: object
      description: Запрос на обновление онтологии
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Название
        description:
          type: string
          description: Описание
        status:
          type: string
          enum: [active, archived]
          description: Статус

    OntologyGraph:
      type: object
      description: Графовая структура онтологии с узлами и рёбрами
      properties:
        tree:
          $ref: '#/components/schemas/ClassTreeNode'
          description: Иерархическое дерево классов
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
          description: Узлы графа
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdge'
          description: Рёбра графа

    ClassTreeNode:
      type: object
      description: Узел иерархического дерева классов
      properties:
        id:
          type: string
          description: Идентификатор
        label:
          $ref: '#/components/schemas/MultilingualLabel'
          description: Локализованная метка
        type:
          type: string
          enum: [Class, ObjectProperty, DatatypeProperty, Individual]
          description: Тип узла
        children:
          type: array
          items:
            $ref: '#/components/schemas/ClassTreeNode'
          description: Дочерние узлы

    GraphNode:
      type: object
      description: Узел графа онтологии
      properties:
        id:
          type: string
          description: Идентификатор
        label:
          type: string
          description: Отображаемое имя
        type:
          type: string
          description: Тип элемента
        isAbstract:
          type: boolean
          description: Является абстрактным
        isDeprecated:
          type: boolean
          description: Помечен как устаревший

    GraphEdge:
      type: object
      description: Ребро графа, связывающее два узла
      properties:
        source:
          type: string
          description: Идентификатор исходного узла
        target:
          type: string
          description: Идентификатор целевого узла
        type:
          type: string
          enum: [SUBCLASS_OF, DOMAIN, RANGE]
          description: Тип связи

    Class:
      type: object
      description: Класс онтологии (элемент TBox)
      properties:
        id:
          type: string
          description: Идентификатор класса
        label:
          $ref: '#/components/schemas/MultilingualLabel'
          description: Локализованная метка
        comment:
          $ref: '#/components/schemas/MultilingualComment'
          description: Локализованные комментарии
        parents:
          type: array
          items:
            type: string
          description: Родительские классы
        isAbstract:
          type: boolean
          description: Является абстрактным
        isDeprecated:
          type: boolean
          description: Помечен как устаревший
        createdAt:
          type: string
          format: date-time
          description: Дата создания
        version:
          type: string
          description: Версия

    ClassListResponse:
      type: object
      description: Ответ со списком классов и пагинацией
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Class'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    CreateClassRequest:
      type: object
      required: [label, commitMessage]
      description: Запрос на создание класса
      properties:
        id:
          type: string
          pattern: '^[A-Za-zА-Яа-яЁё0-9_]+$'
          description: Идентификатор класса
        label:
          $ref: '#/components/schemas/MultilingualLabel'
          description: Локализованная метка
        comment:
          $ref: '#/components/schemas/MultilingualComment'
          description: Локализованные комментарии
        parents:
          type: array
          items:
            type: string
          description: Родительские классы
        isAbstract:
          type: boolean
          default: false
          description: Является абстрактным
        commitMessage:
          type: string
          minLength: 1
          maxLength: 500
          description: Сообщение коммита

    UpdateClassRequest:
      type: object
      required: [commitMessage]
      description: Запрос на обновление класса
      properties:
        label:
          $ref: '#/components/schemas/MultilingualLabel'
          description: Локализованная метка
        comment:
          $ref: '#/components/schemas/MultilingualComment'
          description: Локализованные комментарии
        parents:
          type: array
          items:
            type: string
          description: Родительские классы
        isAbstract:
          type: boolean
          description: Является абстрактным
        deprecated:
          type: boolean
          description: Помечен как устаревший
        commitMessage:
          type: string
          minLength: 1
          maxLength: 500
          description: Сообщение коммита

    Property:
      type: object
      description: Свойство онтологии (ObjectProperty или DatatypeProperty)
      properties:
        id:
          type: string
          description: Идентификатор свойства
        label:
          $ref: '#/components/schemas/MultilingualLabel'
          description: Локализованная метка
        comment:
          $ref: '#/components/schemas/MultilingualComment'
          description: Локализованные комментарии
        propertyType:
          type: string
          enum: [ObjectProperty, DatatypeProperty]
          description: Тип свойства
        domain:
          type: array
          items:
            type: string
          description: Классы области определения
        range:
          oneOf:
            - type: array
              items:
                type: string
            - type: string
              enum: [string, boolean, integer, double, date, dateTime]
          description: Диапазон значений
        characteristics:
          type: object
          properties:
            transitive:
              type: boolean
              description: Транзитивность
            symmetric:
              type: boolean
              description: Симметричность
            functional:
              type: boolean
              description: Функциональность
        inverseOf:
          type: string
          description: Обратное свойство
        multilingual:
          type: boolean
          description: Поддержка мультиязычности
        createdAt:
          type: string
          format: date-time
          description: Дата создания

    PropertyListResponse:
      type: object
      description: Ответ со списком свойств и пагинацией
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Property'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    CreatePropertyRequest:
      type: object
      required: [label, propertyType, domain, range, commitMessage]
      description: Запрос на создание свойства
      properties:
        id:
          type: string
          description: Идентификатор свойства
        label:
          $ref: '#/components/schemas/MultilingualLabel'
          description: Локализованная метка
        comment:
          $ref: '#/components/schemas/MultilingualComment'
          description: Локализованные комментарии
        propertyType:
          type: string
          enum: [ObjectProperty, DatatypeProperty]
          description: Тип свойства
        domain:
          type: array
          items:
            type: string
          minItems: 1
          description: Классы области определения
        range:
          oneOf:
            - type: array
              items:
                type: string
              minItems: 1
            - type: string
              enum: [string, boolean, integer, double, date, dateTime]
          description: Диапазон значений
        characteristics:
          type: object
          properties:
            transitive:
              type: boolean
              description: Транзитивность
