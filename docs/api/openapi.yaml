      description: Выполняет полнотекстовый поиск по всем сущностям онтологии (классам, свойствам, индивидам) с учётом языка интерфейса. Поддерживает фильтрацию по типу сущности, ограничение количества результатов и многоязычный поиск по локализованным меткам и комментариям. Результаты ранжируются по релевантности.
