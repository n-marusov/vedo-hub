// AI Orchestration Service gRPC contract.
// Central gateway for LLM-powered features: NL→OWL generation,
// AI-assisted completion, refinement workflow, template management,
// LLM policy enforcement, and usage auditing.
//
// All AI business logic lives here — the API Gateway proxies to this service.
syntax = "proto3";

package vedo.ai_orchestration.v1;

option go_package = "vedo-core/src/services/shared/proto/ai-orchestration/v1;ai_orchestrationv1";
option java_multiple_files = true;
option java_package = "com.vedo.ai_orchestration.v1";

import "common/v1/common.proto";

// =============================================================================
// Sequence Step (shared across GenerateOWL and RefineOntology)
// =============================================================================

message SequenceStep {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_CREATE_CLASS = 1;
    OPERATION_CREATE_OBJECT_PROPERTY = 2;
    OPERATION_CREATE_DATATYPE_PROPERTY = 3;
    OPERATION_CREATE_INDIVIDUAL = 4;
    OPERATION_ADD_ANNOTATION = 5;
    OPERATION_SET_PARENT = 6;
    OPERATION_SET_DOMAIN = 7;
    OPERATION_SET_RANGE = 8;
  }
  Operation operation = 1;
  string entity_id = 2;        // IRI or generated ID
  string label = 3;            // rdfs:label
  string parent_id = 4;        // for classes — parent class ID
  string domain_id = 5;        // for properties
  string range_id = 6;         // for properties
  repeated string annotations = 7; // key=value pairs
  bool skip_if_exists = 8;     // skip if entity already exists in ontology
}

// =============================================================================
// GenerateOWL — NL→OWL conversion
// =============================================================================

message GenerateOWLRequest {
  string ontology_id = 1;
  string text = 2;             // Natural language input (max 50KB)
  string model = 3;            // Optional model override
  string trace_id = 4;         // OpenTelemetry trace ID for correlation
}

message GenerateOWLResponse {
  repeated SequenceStep steps = 1;
  int32 total_steps = 2;
  repeated string warnings = 3;
  int32 tokens_used = 4;
  int32 prompt_tokens = 5;
  vedo.common.v1.ErrorDetail error = 6;
}

// =============================================================================
// NaturalLanguageQuery — Arbitrary NL queries against ontology context
// =============================================================================

message NaturalLanguageQueryRequest {
  string ontology_id = 1;
  string query = 2;            // Natural language question
  string model = 3;            // Optional model override
  string ontology_context = 4; // Optional serialized ontology context for grounding
  string trace_id = 5;
}

message NaturalLanguageQueryResponse {
  string answer = 1;
  int32 tokens_used = 2;
  int32 prompt_tokens = 3;
  vedo.common.v1.ErrorDetail error = 4;
}

// =============================================================================
// RefineOntology — Iterative refinement (server-streaming)
// =============================================================================

message RefineOntologyRequest {
  string ontology_id = 1;
  string session_id = 2;       // Refinement session ID (UUID)
  string feedback = 3;         // User feedback / refinement instruction
  string model = 4;            // Optional model override
  string trace_id = 5;
}

message RefineOntologyResponse {
  enum RefinementType {
    REFINEMENT_TYPE_UNSPECIFIED = 0;
    REFINEMENT_TYPE_INCREMENTAL = 1;
    REFINEMENT_TYPE_COMPLETE = 2;
    REFINEMENT_TYPE_ERROR = 3;
  }
  RefinementType type = 1;
  repeated SequenceStep steps = 2;
  string session_id = 3;
  int32 token_used = 4;
  string message = 5;          // Human-readable update description or error
  vedo.common.v1.ErrorDetail error = 6;
}

// =============================================================================
// Complete — AI-assisted completion (server-streaming)
// =============================================================================

message CompleteRequest {
  enum CompletionType {
    COMPLETION_TYPE_UNSPECIFIED = 0;
    COMPLETION_TYPE_SUGGEST_CLASSES = 1;
    COMPLETION_TYPE_SUGGEST_PROPERTIES = 2;
    COMPLETION_TYPE_SUGGEST_RELATIONSHIPS = 3;
    COMPLETION_TYPE_COMPLETE_ANY = 4;
  }
  CompletionType type = 1;
  string ontology_id = 2;
  string partial_text = 3;     // Partial text to complete
  string context_json = 4;     // Optional context (existing classes/properties as JSON)
  string model = 5;
  string trace_id = 6;
}

message CompleteResponse {
  oneof completion {
    string token = 1;          // Streaming token (server-sent)
    SuggestionBatch batch = 2; // Batched suggestions (final message)
  }
  vedo.common.v1.ErrorDetail error = 3;
}

message SuggestionBatch {
  repeated string suggestions = 1;
  int32 tokens_used = 2;
  int32 prompt_tokens = 3;
}



// =============================================================================
// CheckPolicy — LLM usage policy check (used by document-extractor)
// =============================================================================

message CheckPolicyRequest {
  string ontology_id = 1;
  string action = 2;           // e.g., "document_extraction", "nl_to_owl", "completion"
  string user_id = 3;
  string trace_id = 4;
}

message CheckPolicyResponse {
  bool allowed = 1;
  string provider = 2;         // Recommended provider identifier
  string model = 3;            // Recommended model
  string reason = 4;           // Human-readable reason for the decision
  bool require_consent = 5;    // Whether user consent is required before proceeding
  vedo.common.v1.ErrorDetail error = 6;
}

// =============================================================================
// LogLLMUsage — Centralized LLM usage audit
// =============================================================================

message LogLLMUsageRequest {
  string ontology_id = 1;
  string action = 2;           // e.g., "document_extraction", "nl_to_owl", "completion"
  string provider = 3;         // LLM provider used
  string model = 4;            // LLM model used
  int32 tokens_in = 5;         // Input tokens
  int32 tokens_out = 6;        // Output tokens
  double cost = 7;             // Estimated cost in USD
  string trace_id = 8;
  string user_id = 9;
  int32 duration_ms = 10;      // Request duration in milliseconds
}

message LogLLMUsageResponse {
  bool recorded = 1;
  vedo.common.v1.ErrorDetail error = 2;
}

// =============================================================================
// AI Orchestration Service
// =============================================================================

service AIOrchestrationService {
  // NL→OWL — Convert natural language text to OWL ontology structure (unary)
  rpc GenerateOWL(GenerateOWLRequest) returns (GenerateOWLResponse);

  // NaturalLanguageQuery — Answer NL questions grounded in ontology context (unary)
  rpc NaturalLanguageQuery(NaturalLanguageQueryRequest) returns (NaturalLanguageQueryResponse);

  // RefineOntology — Iterative refinement with server-streaming updates
  rpc RefineOntology(RefineOntologyRequest) returns (stream RefineOntologyResponse);

  // Complete — AI-assisted completion with server-streaming tokens
  rpc Complete(CompleteRequest) returns (stream CompleteResponse);


  // Policy check — Used by document-extractor (Hybrid Model)
  rpc CheckPolicy(CheckPolicyRequest) returns (CheckPolicyResponse);

  // LLM usage audit — Centralized usage logging
  rpc LogLLMUsage(LogLLMUsageRequest) returns (LogLLMUsageResponse);
}
