[workspace]
resolver = "2"
members = [
    "ontology-service",
    "versioning-service",
    "shared",
    "publisher-service",
    "public-browse-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "time"] }
tower-http = { version = "0.5", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tower = { version = "0.4", features = ["util"] }
thiserror = "1"
async-graphql = { version = "7.0", features = ["uuid"] }
async-graphql-axum = "7.0"
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
tonic = { version = "0.12", features = ["gzip", "tls"] }
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "trace"] }
tracing-opentelemetry = "0.28"
