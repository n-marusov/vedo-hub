version: v2
plugins:
  # Go
  - local: protoc-gen-go
    out: .
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: .
    opt: paths=source_relative
  # Rust (tonic)
  - local: protoc-gen-tonic
    out: .
    opt: build_client=true,build_server=true
  - local: protoc-gen-prost
    out: .
    opt: file_descriptor_set=true
