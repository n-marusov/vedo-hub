// Public Browse API gRPC contract.
// Read-only browsing and search for published ontologies.
syntax = "proto3";

package vedo.public_browse.v1;

option go_package = "vedo-core/src/services/shared/proto/public_browse/v1;publicbrowsev1";
option java_multiple_files = true;
option java_package = "com.vedo.public_browse.v1";

import "common/v1/common.proto";

// =============================================================================
// BrowseOntology
// =============================================================================

message BrowseOntologyRequest {
  string ontology_id = 1;
  string version_tag = 2;  // empty = latest
}

message BrowseOntologyResponse {
  string ontology_id = 1;
  string name = 2;
  string description = 3;
  string version_tag = 4;
  int32 class_count = 5;
  int32 property_count = 6;
  repeated string root_classes = 7; // root class IRIs
  string ontology_ttl = 8;          // Turtle serialization
  vedo.common.v1.ErrorDetail error = 9;
}

// =============================================================================
// Search
// =============================================================================

message SearchRequest {
  string query = 1;
  enum SearchScope {
    SEARCH_SCOPE_UNSPECIFIED = 0;
    SEARCH_SCOPE_CLASS = 1;
    SEARCH_SCOPE_PROPERTY = 2;
    SEARCH_SCOPE_ONTOLOGY = 3;
  }
  SearchScope scope = 2;
  vedo.common.v1.PaginationRequest pagination = 3;
}

message SearchResult {
  string entity_id = 1;
  string label = 2;
  string description = 3;
  string ontology_id = 4;
  string ontology_name = 5;
  string entity_type = 6;
  float score = 7;
}

message SearchResponse {
  repeated SearchResult results = 1;
  vedo.common.v1.PaginationResponse pagination = 2;
  vedo.common.v1.ErrorDetail error = 3;
}

// =============================================================================
// GetClassHierarchy
// =============================================================================

message GetClassHierarchyRequest {
  string ontology_id = 1;
  string version_tag = 2;
  string class_id = 3;     // empty = return full hierarchy from root
}

message HierarchyNode {
  string class_id = 1;
  string label = 2;
  int32 child_count = 3;
  repeated HierarchyNode children = 4;
}

message GetClassHierarchyResponse {
  repeated HierarchyNode tree = 1;
  vedo.common.v1.ErrorDetail error = 2;
}

// =============================================================================
// Public Browse Service
// =============================================================================

service PublicBrowseService {
  rpc BrowseOntology(BrowseOntologyRequest) returns (BrowseOntologyResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc GetClassHierarchy(GetClassHierarchyRequest) returns (GetClassHierarchyResponse);
}
