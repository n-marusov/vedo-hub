# GitLab CI pipeline definition

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  NPM_CACHE_DIR: ${CI_PROJECT_DIR}/.npm
  PIP_CACHE_DIR: ${CI_PROJECT_DIR}/.pip
  GO_CACHE_DIR: ${CI_PROJECT_DIR}/.go
  RUSTFLAGS: "-D warnings"
  REGISTRY: ${CI_REGISTRY_IMAGE}

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cargo/
    - .npm/
    - .pip/
    - .go/

stages:
  - lint
  - test
  - build
  - integration
  - security
  - deploy

# --- Lint Stage ---

test-quality-gate:
  stage: lint
  image: alpine:3.19
  before_script:
    - apk add --no-cache grep findutils
  script:
    - chmod +x tools/scripts/test-quality-gate.sh
    - tools/scripts/test-quality-gate.sh src/services
  allow_failure: false
  rules:
    - changes:
        - apps/services/**/*_test.go
        - apps/services/**/*_test.rs
        - apps/services/**/tests/*.rs
        - apps/services/**/test_*.py
        - apps/services/**/*_test.py
        - apps/services/**/*.spec.ts
        - apps/services/**/*.test.ts
        - apps/services/**/*.go
        - apps/services/**/*.rs
        - apps/services/**/*.py
        - apps/services/**/*.ts

frontend-lint:
  stage: lint
  image: node:20-alpine
  before_script:
    - npm install -g pnpm@11
  script:
    - cd apps/services/frontend
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm run lint
    - pnpm run typecheck
  rules:
    - changes:
        - apps/services/frontend/**/*

rust-lint:
  stage: lint
  image: rust:1.77-slim-bookworm
  script:
    - cd apps/services/ontology-service && cargo clippy --lib -- -D warnings
    - cd apps/services/versioning-service && cargo clippy --lib -- -D warnings
  rules:
    - changes:
        - apps/services/**/Cargo.toml
        - apps/services/**/*.rs

go-lint:
  stage: lint
  image: golang:1.22-alpine
  script:
    - cd apps/services/api-gateway && go vet ./...
    - cd apps/services/auth-service && go vet ./...
  rules:
    - changes:
        - apps/vedo-cli/**/*.go, apps/services/**/*.go

document-extractor-lint:
  stage: lint
  image: python:3.12-slim
  script:
    - cd apps/services/document-extractor
    - pip install -e ".[dev]"
    - ruff check .
    - pip install basedpyright
    - basedpyright main.py config.py
  rules:
    - changes:
        - apps/services/document-extractor/**/*.py

docs-lint:
  stage: lint
  image: node:20-alpine
  script:
    - npm install -g @antora/cli@3.1 @antora/site-generator-default@3.1 asciidoctor-kroki
    - cd src/docs && for pb in playbook-admin-guides.yml playbook-developer-guides.yml playbook-operator-runbooks.yml playbook-user-guides.yml; do antora --fetch "$pb"; done
    - node docs/scripts/check-links.mjs
    - node docs/scripts/check-style.mjs
    - node docs/scripts/check-snippets.mjs
  rules:
    - changes:
        - docs/**/*.adoc
        - docs/**/*.md
        - docs/**/*

proto-lint:
  stage: lint
  image: bufbuild/buf:latest
  script:
    - cd apps/shared/proto && buf lint
  rules:
    - changes:
        - apps/shared/proto/**/*.proto

tls-certs:
  stage: build
  image: alpine:latest
  script:
    - apk add --no-cache openssl
    - mkdir -p /etc/vedo/tls
    - openssl req -x509 -nodes -days 365 -newkey rsa:2048
      -keyout /etc/vedo/tls/grpc-server.key
      -out /etc/vedo/tls/grpc-server.crt
      -subj "/CN=localhost"
      -addext "subjectAltName=DNS:localhost,DNS:*.vedo-network,DNS:ontology-service,DNS:versioning-service,DNS:auth-service,DNS:commenting-service,DNS:publisher-service,DNS:public-browse-api"
    - cp /etc/vedo/tls/grpc-server.crt /etc/vedo/tls/ca.crt
  artifacts:
    paths:
      - /etc/vedo/tls/
    expire_in: 30 days
  rules:
    - if: '$GRPC_TLS_ENABLED == "true"'
  allow_failure: true

proto-breaking:
  stage: lint
  image: bufbuild/buf:latest
  script:
    - cd apps/shared/proto && buf breaking --against '.git#branch=main'
  rules:
    - changes:
        - apps/shared/proto/**/*.proto
        - apps/shared/proto/buf.yaml

# --- Test Stage ---

contract-tests-frontend:
  stage: test
  image: node:20-alpine
  before_script:
    - npm install -g pnpm@11
  script:
    - cd apps/services/frontend
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm test -- --run
  artifacts:
    reports:
      junit: apps/services/frontend/junit.xml

contract-tests-rust:
  stage: test
  image: rust:1.77-slim-bookworm
  script:
    - cd apps/services/ontology-service && cargo test --lib
    - cd apps/services/versioning-service && cargo test --lib
  artifacts:
    reports:
      junit: apps/services/versioning-service/target/nextest/junit.xml

contract-tests-go:
  stage: test
  image: golang:1.22-alpine
  script:
    - cd apps/services/api-gateway && go test ./...
    - cd apps/services/auth-service && go test ./...
  artifacts:
    reports:
      junit: apps/services/**/junit.xml

contract-tests-python:
  stage: test
  image: python:3.12-slim
  script:
    - cd apps/services/metrics-service
    - pip install -e ".[test]"
    - pytest tests/
  artifacts:
    reports:
      junit: apps/services/metrics-service/junit.xml

document-extractor-test:
  stage: test
  image: python:3.12-slim
  script:
    - cd apps/services/document-extractor
    - pip install -e ".[dev]"
    - pytest tests/
  artifacts:
    reports:
      junit: apps/services/document-extractor/junit.xml
  rules:
    - changes:
        - apps/services/document-extractor/**/*.py

vitest-contract-tests:
  stage: test
  image: node:20-alpine
  script:
    - npm ci
    - npx vitest run --config vitest.config.ts
  artifacts:
    reports:
      junit: junit.xml

docs-build:
  stage: build
  image: node:20-alpine
  script:
    - npm install -g @antora/cli@3.1 @antora/site-generator-default@3.1 asciidoctor-kroki
    - node docs/scripts/build-docs.mjs
  artifacts:
    paths:
      - docs/_site/
      - docs/_offline-bundle/
    expire_in: 30 days
  rules:
    - changes:
        - docs/**/*
        - docs/**/*

# --- Build Stage ---

vendor-go:
  stage: build
  image: golang:1.24-alpine
  before_script:
    - apk add --no-cache make
  script:
    - make vendor-go
  artifacts:
    paths:
      - apps/services/*/vendor/
    expire_in: 1 hour
  rules:
    - changes:
        - apps/services/*/go.mod
        - apps/services/*/go.sum
        - apps/services/*/*.go

build-frontend:
  stage: build
  image: docker:24.0-cli
  services:
    - docker:24.0-dind
  script:
    - docker build -t ${REGISTRY}/vedo-frontend:${CI_COMMIT_SHORT_SHA} -t ${REGISTRY}/vedo-frontend:latest apps/services/frontend
    - docker push ${REGISTRY}/vedo-frontend:${CI_COMMIT_SHORT_SHA}
    - docker push ${REGISTRY}/vedo-frontend:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build-api-gateway:
  stage: build
  image: docker:24.0-cli
  services:
    - docker:24.0-dind
  needs:
    - vendor-go
  script:
    - docker build -t ${REGISTRY}/vedo-api-gateway:${CI_COMMIT_SHORT_SHA} -t ${REGISTRY}/vedo-api-gateway:latest -f Dockerfile apps/services/api-gateway
    - docker push ${REGISTRY}/vedo-api-gateway:${CI_COMMIT_SHORT_SHA}
    - docker push ${REGISTRY}/vedo-api-gateway:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build-ontology-service:
  stage: build
  image: docker:24.0-cli
  services:
    - docker:24.0-dind
  script:
    - docker build -t ${REGISTRY}/vedo-ontology-service:${CI_COMMIT_SHORT_SHA} -t ${REGISTRY}/vedo-ontology-service:latest apps/services/ontology-service
    - docker push ${REGISTRY}/vedo-ontology-service:${CI_COMMIT_SHORT_SHA}
    - docker push ${REGISTRY}/vedo-ontology-service:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build-versioning-service:
  stage: build
  image: docker:24.0-cli
  services:
    - docker:24.0-dind
  script:
    - docker build -t ${REGISTRY}/vedo-versioning-service:${CI_COMMIT_SHORT_SHA} -t ${REGISTRY}/vedo-versioning-service:latest apps/services/versioning-service
    - docker push ${REGISTRY}/vedo-versioning-service:${CI_COMMIT_SHORT_SHA}
    - docker push ${REGISTRY}/vedo-versioning-service:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build-auth-service:
  stage: build
  image: docker:24.0-cli
  services:
    - docker:24.0-dind
  needs:
    - vendor-go
  script:
    - docker build -t ${REGISTRY}/vedo-auth-service:${CI_COMMIT_SHORT_SHA} -t ${REGISTRY}/vedo-auth-service:latest apps/services/auth-service
    - docker push ${REGISTRY}/vedo-auth-service:${CI_COMMIT_SHORT_SHA}
    - docker push ${REGISTRY}/vedo-auth-service:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build-metrics-service:
  stage: build
  image: docker:24.0-cli
  services:
    - docker:24.0-dind
  script:
    - docker build -t ${REGISTRY}/vedo-metrics-service:${CI_COMMIT_SHORT_SHA} -t ${REGISTRY}/vedo-metrics-service:latest apps/services/metrics-service
    - docker push ${REGISTRY}/vedo-metrics-service:${CI_COMMIT_SHORT_SHA}
    - docker push ${REGISTRY}/vedo-metrics-service:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

document-extractor-build:
  stage: build
  image: docker:24.0-cli
  services:
    - docker:24.0-dind
  script:
    - docker build -t ${REGISTRY}/vedo-document-extractor:${CI_COMMIT_SHORT_SHA} -t ${REGISTRY}/vedo-document-extractor:latest apps/services/document-extractor
    - docker push ${REGISTRY}/vedo-document-extractor:${CI_COMMIT_SHORT_SHA}
    - docker push ${REGISTRY}/vedo-document-extractor:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# --- Integration Stage ---

integration-tests:
  stage: integration
  image: node:20-alpine
  before_script:
    - npm install -g pnpm@11
  script:
    - cd apps/services/frontend
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm test -- --run tests/api-compatibility/api-compatibility.spec.ts tests/backup-restore/backup-restore-integration.spec.ts tests/observability/observability.spec.ts tests/data-lifecycle/data-lifecycle.spec.ts tests/administration/administration.spec.ts tests/deployment/deployment-operations.spec.ts
  needs:
    - contract-tests-frontend
    - contract-tests-rust
    - contract-tests-go
    - contract-tests-python

property-based-tests:
  stage: integration
  image: rust:1.77-slim-bookworm
  script:
    - cd apps/services/ontology-service && cargo test --lib
    - cd apps/services/versioning-service && cargo test --lib
  needs:
    - contract-tests-frontend
    - contract-tests-rust

# --- Platform Integrity Stage ---

platform-integrity-checks:
  stage: integration
  image: docker:24.0-cli
  services:
    - docker:24.0-dind
  before_script:
    - apk add --no-cache go bash
  script:
    - chmod +x tests/integration/check-platform-integrity.sh
    - ./tests/integration/check-platform-integrity.sh
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - contract-tests-frontend
    - contract-tests-rust
    - contract-tests-go
    - contract-tests-python

platform-integrity-contract-tests:
  stage: test
  image: golang:1.21-alpine
  script:
    - cd llm/src/platform-integrity  # NOTE: path needs verification
    - go mod tidy
    - go vet ./...
    - go test ./... -v -count=1
  rules:
    - changes:
        - llm/src/platform-integrity/**/*  # NOTE: path needs verification

# --- Security Stage ---

security-sast:
  stage: security
  image: docker:24.0-cli
  services:
    - docker:24.0-dind
  script:
    - docker run --rm -v ${CI_PROJECT_DIR}:/code aquasec/trivy:latest filesystem --severity CRITICAL,HIGH /code/src
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

security-dast:
  stage: security
  image: node:20-alpine
  script:
    - npm install -g zaproxy
    - echo "DAST scan placeholder — requires running environment"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

security-dependency-scan:
  stage: security
  image: node:20-alpine
  script:
    - cd apps/services/frontend && npm audit --audit-level=high
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

# --- Deploy Stage ---

deploy-staging:
  stage: deploy
  image: alpine/helm:3.14
  script:
    - helm upgrade --install vedo-core ./deploy/helm --namespace vedo --values ./deploy/helm/values.yaml --set global.environment=staging
  environment:
    name: staging
    url: https://staging.vedo.dev
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - build-frontend
    - build-api-gateway
    - build-ontology-service
    - build-versioning-service
    - build-auth-service
    - build-metrics-service
    - document-extractor-build
    - docs-build
    - integration-tests
    - security-sast

deploy-docs:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Deploying documentation site..."
    - cp -r docs/_site/* public/
  environment:
    name: docs
    url: https://docs.vedo.dev
  artifacts:
    paths:
      - public/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - docs-build
