name: vedo-core-docs

services:
  docs-user:
    image: nginx:1.25-alpine
    restart: unless-stopped
    profiles: ["documentation"]
    volumes:
      - ./docs/antora/build/site/user-guide:/usr/share/nginx/html:ro
    ports: ["${DOCS_USER_PORT:-5000}:${DOCS_USER_CONTAINER_PORT:-5000}"]
    command: ["sh", "-c", "sed -i 's/listen       80;/listen       ${DOCS_USER_CONTAINER_PORT:-5000};/' /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"]

  docs-dev:
    image: nginx:1.25-alpine
    restart: unless-stopped
    profiles: ["documentation"]
    volumes:
      - ./docs/antora/build/site/developer-guide:/usr/share/nginx/html:ro
    ports: ["${DOCS_DEV_PORT:-5001}:${DOCS_DEV_CONTAINER_PORT:-5001}"]
    command: ["sh", "-c", "sed -i 's/listen       80;/listen       ${DOCS_DEV_CONTAINER_PORT:-5001};/' /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"]

  docs-admin:
    image: nginx:1.25-alpine
    restart: unless-stopped
    profiles: ["documentation"]
    volumes:
      - ./docs/antora/build/site/admin-guide:/usr/share/nginx/html:ro
    ports: ["${DOCS_ADMIN_PORT:-5002}:${DOCS_ADMIN_CONTAINER_PORT:-5002}"]
    command: ["sh", "-c", "sed -i 's/listen       80;/listen       ${DOCS_ADMIN_CONTAINER_PORT:-5002};/' /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"]

  docs-integrator:
    image: nginx:1.25-alpine
    restart: unless-stopped
    profiles: ["documentation"]
    volumes:
      - ./docs/antora/build/site/integrator-guide:/usr/share/nginx/html:ro
    ports: ["${DOCS_INTEGRATOR_PORT:-5003}:${DOCS_INTEGRATOR_CONTAINER_PORT:-5003}"]
    command: ["sh", "-c", "sed -i 's/listen       80;/listen       ${DOCS_INTEGRATOR_CONTAINER_PORT:-5003};/' /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"]
