# Prometheus scrape configuration for VEDO Core
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: vedo-core

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - alert-rules.yml

scrape_configs:
  - job_name: vedo-api-gateway
    static_configs:
      - targets: ["api-gateway:8080"]
        labels:
          service: api-gateway
          team: platform-team
    metrics_path: /metrics
    scheme: http

  - job_name: vedo-ontology-service
    static_configs:
      - targets: ["ontology-service:8082"]
        labels:
          service: ontology-service
          team: platform-team
    metrics_path: /metrics
    scheme: http

  - job_name: vedo-versioning-service
    static_configs:
      - targets: ["versioning-service:8083"]
        labels:
          service: versioning-service
          team: platform-team
    metrics_path: /metrics
    scheme: http

  - job_name: vedo-auth-service
    static_configs:
      - targets: ["auth-service:8081"]
        labels:
          service: auth-service
          team: platform-team
    metrics_path: /metrics
    scheme: http

  - job_name: vedo-metrics-service
    static_configs:
      - targets: ["metrics-service:8084"]
        labels:
          service: metrics-service
          team: platform-team
    metrics_path: /metrics
    scheme: http

  - job_name: vedo-grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: grafana
          component: observability
    metrics_path: /metrics
    scheme: http

  - job_name: vedo-loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: loki
          component: observability
    metrics_path: /metrics
    scheme: http

  - job_name: vedo-tempo
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          service: tempo
          component: observability
    metrics_path: /metrics
    scheme: http

  - job_name: vedo-otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          service: otel-collector
          component: observability
    metrics_path: /metrics
    scheme: http
