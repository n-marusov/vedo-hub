name: vedo-core

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 3

include:
  - path: ./docker-compose.docs.yaml

services:
  # Frontend
  frontend:
    build:
      context: ..
      dockerfile: src/docker/Dockerfile.typescript
      args:
        SERVICE_DIR: src/services/frontend
        VITE_KEYCLOAK_REALM: vedo-core
        VITE_KEYCLOAK_CLIENT_ID: vedo-core-frontend
        VITE_KEYCLOAK_URL: http://localhost:8180
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_WS_URL=ws://localhost:8080
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - vedo-network
    # nginx:alpine has busybox wget but no node — use wget, hit /health (served from public/health.json)
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health"]

  # API Gateway
  api-gateway:
    build:
      context: ..
      dockerfile: src/docker/Dockerfile.go
      args:
        SERVICE_DIR: src/services
        BINARY_NAME: api-gateway
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - SERVICE_PORT=8080
      - ONTOLOGY_SERVICE_URL=http://ontology-service:8082
      - VERSIONING_SERVICE_URL=http://versioning-service:8083
      - AUTH_SERVICE_URL=http://auth-service:8081
      - GRPC_ONTOLOGY_ADDR=ontology-service:9001
      - GRPC_VERSIONING_ADDR=versioning-service:9002
      - GRPC_AUTH_ADDR=auth-service:9003
      - GRPC_COMMENTING_ADDR=commenting-service:9004
      - GRPC_PUBLISHER_ADDR=publisher-service:9005
      - GRPC_PUBLIC_BROWSE_ADDR=public-browse-api:9011
      - GRPC_TLS_ENABLED=${GRPC_TLS_ENABLED:-false}
      - GRPC_CA_CERT_FILE=${GRPC_CA_CERT_FILE:-}
      - KEYCLOAK_JWKS_URL=http://keycloak:8080/realms/vedo-core/protocol/openid-connect/certs
      - ENABLE_SWAGGER_UI=true
    depends_on:
      ontology-service:
        condition: service_healthy
      versioning-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      commenting-service:
        condition: service_healthy
      publisher-service:
        condition: service_healthy
      public-browse-api:
        condition: service_healthy
      ai-orchestration-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]

  # Rust Services
  ontology-service:
    build:
      context: ..
      dockerfile: src/docker/Dockerfile.rust
      args:
        SERVICE_DIR: src/services
        BINARY_NAME: ontology-service
    expose:
      - "8082"
    environment:
      - HOST=0.0.0.0
      - SERVICE_PORT=8082
      - GRPC_PORT=9001
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - GRPC_TLS_ENABLED=${GRPC_TLS_ENABLED:-false}
      - GRPC_TLS_CERT_FILE=${GRPC_TLS_CERT_FILE:-}
      - GRPC_TLS_KEY_FILE=${GRPC_TLS_KEY_FILE:-}
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - vedo-network
    # debian:bookworm-slim runtime has no wget/curl — use bash /dev/tcp
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9001; printf \"\" >&3; echo \"gRPC health via grpc_health_probe recommended\"'"]

  versioning-service:
    build:
      context: ..
      dockerfile: src/docker/Dockerfile.rust
      args:
        SERVICE_DIR: src/services
        BINARY_NAME: versioning-service
    ports:
      - "9002:9002"
    expose:
      - "8083"
    environment:
      - HOST=0.0.0.0
      - SERVICE_PORT=8083
      - GRPC_PORT=9002
      - DATABASE_URL=postgres://postgres:password@postgres:5432/vedo_versioning
      - GRPC_TLS_ENABLED=${GRPC_TLS_ENABLED:-false}
      - GRPC_TLS_CERT_FILE=${GRPC_TLS_CERT_FILE:-}
      - GRPC_TLS_KEY_FILE=${GRPC_TLS_KEY_FILE:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vedo-network
    # debian:bookworm-slim runtime has no wget/curl — use bash /dev/tcp
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9002'"]

  auth-service:
    build:
      context: ..
      dockerfile: src/docker/Dockerfile.go
      args:
        SERVICE_DIR: src/services
        BINARY_NAME: auth-service
    ports:
      - "9003:9003"
    expose:
      - "8081"
    environment:
      - HOST=0.0.0.0
      - SERVICE_PORT=8081
      - GRPC_PORT=9003
      # Keycloak OIDC for JWT introspection (RFC 7662). The `vedo-core-api`
      # confidential client and its secret live in deploy/keycloak/vedo-core-realm.json.
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=vedo-core
      - KEYCLOAK_CLIENT_ID=vedo-core-api
      - KEYCLOAK_CLIENT_SECRET=vedo-core-api-secret
      - GRPC_TLS_ENABLED=${GRPC_TLS_ENABLED:-false}
      - GRPC_TLS_CERT_FILE=${GRPC_TLS_CERT_FILE:-}
      - GRPC_TLS_KEY_FILE=${GRPC_TLS_KEY_FILE:-}
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/health"]

  # Python Services
  metrics-service:
    build:
      context: ..
      dockerfile: src/docker/Dockerfile.python
      args:
        SERVICE_DIR: src/services/metrics-service
    ports:
      - "8084:8084"
    environment:
      - HOST=0.0.0.0
      - SERVICE_PORT=8084
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - REDIS_URL=redis://redis:6379
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vedo-network
    # python:3.12-slim runtime has no wget/curl — use bash /dev/tcp
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8084; printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]

  # Publishing — Vue 3 viewer for published ontologies
  publish-browse-ui:
    build:
      context: ..
      dockerfile: src/docker/Dockerfile.typescript
      args:
        SERVICE_DIR: src/services/publish-browse-ui
    ports:
      - "3002:3002"
    networks:
      - vedo-network
    # nginx:alpine — busybox wget, hit /health (served from public/health.json)
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3002/health"]

  # Publishing — Rust publisher service
  publisher-service:
    build:
      context: ..
      dockerfile: src/docker/Dockerfile.rust
      args:
        SERVICE_DIR: src/services
        BINARY_NAME: publisher-service
    ports:
      - "9005:9005"
    expose:
      - "8086"
    environment:
      - HOST=0.0.0.0
      - SERVICE_PORT=8086
      - GRPC_PORT=9005
      - GRPC_TLS_ENABLED=${GRPC_TLS_ENABLED:-false}
      - GRPC_TLS_CERT_FILE=${GRPC_TLS_CERT_FILE:-}
      - GRPC_TLS_KEY_FILE=${GRPC_TLS_KEY_FILE:-}
    networks:
      - vedo-network
    # debian:bookworm-slim runtime has no wget/curl — use bash /dev/tcp
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9005'"]

  # Public browse — Rust public read-only API
  public-browse-api:
    build:
      context: ..
      dockerfile: src/docker/Dockerfile.rust
      args:
        SERVICE_DIR: src/services
        BINARY_NAME: public-browse-api
    ports:
      - "9011:9011"
    expose:
      - "8087"
    environment:
      - HOST=0.0.0.0
      - SERVICE_PORT=8087
      - GRPC_PORT=9011
      - GRPC_TLS_ENABLED=${GRPC_TLS_ENABLED:-false}
      - GRPC_TLS_CERT_FILE=${GRPC_TLS_CERT_FILE:-}
      - GRPC_TLS_KEY_FILE=${GRPC_TLS_KEY_FILE:-}
    depends_on:
      publisher-service:
        condition: service_healthy
    networks:
      - vedo-network
    # debian:bookworm-slim runtime has no wget/curl — use bash /dev/tcp
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9011'"]

  # Commenting — Go service
  commenting-service:
    build:
      context: ..
      dockerfile: src/docker/Dockerfile.go
      args:
        SERVICE_DIR: src/services
        BINARY_NAME: commenting-service
    ports:
      - "9004:9004"
    expose:
      - "8085"
    environment:
      - HOST=0.0.0.0
      - SERVICE_PORT=8085
      - GRPC_PORT=9004
      - GRPC_TLS_ENABLED=${GRPC_TLS_ENABLED:-false}
      - GRPC_TLS_CERT_FILE=${GRPC_TLS_CERT_FILE:-}
      - GRPC_TLS_KEY_FILE=${GRPC_TLS_KEY_FILE:-}
    networks:
      - vedo-network
    # alpine runtime has busybox wget
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8085/health"]

  # Ticket domain — Go (Gin) API
  ticket-api:
    build:
      context: ..
      dockerfile: src/docker/Dockerfile.go
      args:
        SERVICE_DIR: src/services
        BINARY_NAME: ticket-api
    ports:
      - "9010:9010"
      - "8088:8088"
    environment:
      - HOST=0.0.0.0
      - STUB_PORT=8088
      - SERVICE_PORT=8088
      - GRPC_PORT=9010
      - APP_ENV=development
      - APP_VERSION=0.2.0
      - GRPC_TLS_ENABLED=${GRPC_TLS_ENABLED:-false}
      - GRPC_TLS_CERT_FILE=${GRPC_TLS_CERT_FILE:-}
      - GRPC_TLS_KEY_FILE=${GRPC_TLS_KEY_FILE:-}
    networks:
      - vedo-network
    # Gin service reads STUB_PORT (not SERVICE_PORT) — alpine wget
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8088/health"]

  # Ticket classifier — Python (reads SERVICE_PORT)
  ticket-classifier:
    build:
      context: ..
      dockerfile: src/docker/Dockerfile.python
      args:
        SERVICE_DIR: src/services/ticket-classifier
    ports:
      - "8089:8089"
    environment:
      - HOST=0.0.0.0
      - SERVICE_PORT=8089
    networks:
      - vedo-network
    # python:3.12-slim runtime has no wget/curl — use bash /dev/tcp
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8089; printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]

  # Ticket telemetry listener — Go (Gin), reads STUB_PORT + CLASSIFIER_URL.
  # Dockerfile copies ticket-api/ via go.mod replace -> build context = src/services/.
  ticket-telemetry-listener:
    build:
      context: ..
      dockerfile: src/docker/Dockerfile.go
      args:
        SERVICE_DIR: src/services
        BINARY_NAME: ticket-telemetry-listener
    ports:
      - "8090:8090"
    environment:
      - STUB_PORT=8090
      - CLASSIFIER_URL=http://ticket-classifier:8089
    depends_on:
      ticket-classifier:
        condition: service_healthy
    networks:
      - vedo-network
    # alpine runtime has busybox wget
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/health"]

  # Document Extractor — Python service for AI-assisted ontology extraction
  document-extractor:
    build:
      context: ..
      dockerfile: src/docker/Dockerfile.python
      args:
        SERVICE_DIR: src/services/document-extractor
    ports:
      - "9013:9013"
    expose:
      - "8092"   # HTTP health
      - "9013"   # gRPC internal
    environment:
      - HOST=0.0.0.0
      - SERVICE_PORT=8092
      - ONTOLOGY_SERVICE_URL=ontology-service:9001
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_PROVIDERS_OLLAMA_BASE_URL=${LLM_PROVIDERS_OLLAMA_BASE_URL:-http://localhost:11434/v1}
      - LLM_PROVIDERS_OLLAMA_MODEL=${LLM_PROVIDERS_OLLAMA_MODEL:-llama3}
      - MAX_FILE_SIZE_MB=20
    depends_on:
      ontology-service:
        condition: service_healthy
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8092; printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]

  # AI Orchestration Service — Go gRPC service for LLM-powered features
  ai-orchestration-service:
    build:
      context: ..
      dockerfile: src/docker/Dockerfile.go
      args:
        SERVICE_DIR: src/services
        BINARY_NAME: ai-orchestration-service
    expose:
      - "8093"   # HTTP health
      - "9014"   # gRPC internal
    environment:
      - HOST=0.0.0.0
      - GRPC_PORT=9014
      - HEALTH_PORT=8093
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - REDIS_URL=redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8093/health"]

  # Ticket notifier — Go (Gin), reads STUB_PORT
  ticket-notifier:
    build:
      context: ..
      dockerfile: src/docker/Dockerfile.go
      args:
        SERVICE_DIR: src/services
        BINARY_NAME: ticket-notifier
    ports:
      - "8091:8091"
    environment:
      - STUB_PORT=8091
    networks:
      - vedo-network
    # alpine runtime has busybox wget
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8091/health"]

  # Data Stores
  neo4j:
    image: neo4j:5.15-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=vedo_versioning
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U postgres"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "rabbitmq-diagnostics", "ping"]

  # Object storage (S3-compatible) for published ontology artifacts
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "mc", "ready", "local"]
      start_period: 10s

  # Vedu CLI build step (compile-only — not a daemon)
  vedo-cli-build:
    profiles: ["local", "ci"]
    image: golang:1.21-alpine
    working_dir: /app
    volumes:
      - ../src/cli:/app
    command: >
      sh -c "go build -o /dev/null ."
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "exit 0"]
      start_period: 0s

  # Keycloak for Auth
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    ports:
      - "8180:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      # Canonical hostname so every token carries the browser-facing issuer.
      # Otherwise tokens minted via http://127.0.0.1:8180 carry a different
      # issuer than backchannel introspect requests reach (http://keycloak:8080),
      # and Keycloak marks them inactive during RFC 7662 introspection.
      - KC_HOSTNAME=localhost
      - KC_HOSTNAME_PORT=8180
      - KC_HTTP_ENABLED=true
    volumes:
      # Persist H2 DB + realm state across restarts so `down/up` does not wipe
      # sessions or re-import the realm from scratch every time.
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/vedo-core-realm.json:/opt/keycloak/data/import/vedo-core-realm.json:ro
    command: start-dev --import-realm
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 15s
      retries: 10
      start_period: 60s

networks:
  vedo-network:
    driver: bridge

volumes:
  neo4j_data:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  keycloak_data:
