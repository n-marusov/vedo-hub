name: vedo-core

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 3

include:
  - path: ./docker-compose.docs.yaml

services:
  # Frontend
  frontend:
    build:
      context: ../src/services/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_WS_URL=ws://localhost:8080
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  # API Gateway
  api-gateway:
    build:
      context: ../src/services/api-gateway
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - ONTOLOGY_SERVICE_URL=http://ontology-service:8081
      - VERSIONING_SERVICE_URL=http://versioning-service:8082
      - AUTH_SERVICE_URL=http://auth-service:8084
    depends_on:
      ontology-service:
        condition: service_healthy
      versioning-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health"]

  # Rust Services
  ontology-service:
    build:
      context: ../src/services/ontology-service
    ports:
      - "8081:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health"]

  versioning-service:
    build:
      context: ../src/services/versioning-service
    ports:
      - "8082:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_URL=postgres://postgres:password@postgres:5432/vedo_versioning
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health"]

  auth-service:
    build:
      context: ../src/services/auth-service
    ports:
      - "8084:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - KEYCLOAK_URL=http://keycloak:8080
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health"]

  # Python Services
  metrics-service:
    build:
      context: ../src/services/metrics-service
    ports:
      - "8086:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - REDIS_URL=redis://redis:6379
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health"]

  # Data Stores
  neo4j:
    image: neo4j:5.15-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=vedo_versioning
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U postgres"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "rabbitmq-diagnostics", "ping"]

  # Vedu CLI build step (compile-only — not a daemon)
  vedo-cli-build:
    profiles: ["local", "ci"]
    image: golang:1.21-alpine
    working_dir: /app
    volumes:
      - ../src/cli:/app
    command: >
      sh -c "go build -o /dev/null ."
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "exit 0"]
      start_period: 0s

  # Keycloak for Auth
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    ports:
      - "8180:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
    volumes:
      - ./keycloak/vedo-core-realm.json:/opt/keycloak/data/import/vedo-core-realm.json:ro
    command: start-dev --import-realm
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"HTTP/1.1 200\" <&3'"]
      interval: 15s
      retries: 10
      start_period: 60s

networks:
  vedo-network:
    driver: bridge

volumes:
  neo4j_data:
  postgres_data:
  redis_data:
  rabbitmq_data:
