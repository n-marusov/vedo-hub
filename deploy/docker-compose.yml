# Project name is set via COMPOSE_PROJECT_NAME in .env.* files
# If not set, Docker derives it from the current directory name.
# See config/.env.example for configuration.
#
# SECURITY: Environment variables with default passwords/keys are for
# local development only. In production, inject secrets via:
#   - Docker secrets (swarm) or Kubernetes secrets
#   - HashiCorp Vault (vedo-core production)
#   - CI/CD secret variables (GitLab CI)
# Never commit real credentials to this file or .env.* files.
#
# VEDO_* vars (frontend config.js): served publicly at /config.js.
# Only non-sensitive configuration is allowed — no passwords, API keys,
# tokens, or client secrets. See tests/gates/test_runtime_config_secrets.sh.

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 3

include:
  - docker-compose.docs.yaml

services:
  # ── Frontend — Vue 3 SPA ────────────────────────────────
  # Configuration is injected at runtime via docker-entrypoint.sh
  # which generates /usr/share/nginx/html/config.js from VEDO_*
  # environment variables. No rebuild needed when switching envs.
  frontend:
    build:
      context: ..
      dockerfile: tools/dockerfiles/Dockerfile.typescript
      args:
        SERVICE_DIR: apps/services/frontend
        BUILD_PROFILE: ${BUILD_PROFILE:-production}
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_CONTAINER_PORT:-3000}"
    environment:
      - VEDO_KEYCLOAK_URL=${VEDO_KEYCLOAK_URL:-http://localhost:${KC_HOSTNAME_PORT:-8180}}
      - VEDO_KEYCLOAK_REALM=${VEDO_KEYCLOAK_REALM:-vedo-core}
      - VEDO_KEYCLOAK_CLIENT_ID=${VEDO_KEYCLOAK_CLIENT_ID:-vedo-core-frontend}
      - VEDO_SKIP_AUTH=${VEDO_SKIP_AUTH:-false}
      - VEDO_GRAPHQL_ENDPOINT=${VEDO_GRAPHQL_ENDPOINT:-/api/v1/graphql}
      - VEDO_USE_MOCK_API=${VEDO_USE_MOCK_API:-false}
      - VEDO_APP_VERSION=${SERVICE_VERSION:-dev}
      - VEDO_APP_ENV=${APP_ENV:-dev}
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${FRONTEND_CONTAINER_PORT:-3000}/health"]

  # ── API Gateway — Go (REST/GraphQL → gRPC) ─────────────
  api-gateway:
    build:
      context: ..
      dockerfile: tools/dockerfiles/Dockerfile.go
      args:
        SERVICE_DIR: apps/services
        BINARY_NAME: api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:${API_GATEWAY_CONTAINER_PORT:-8080}"
    environment:
      - HOST=${API_GATEWAY_HOST:-0.0.0.0}
      - SERVICE_PORT=${API_GATEWAY_CONTAINER_PORT:-8080}
      - SERVICE_VERSION=${SERVICE_VERSION:-dev}
      - ONTOLOGY_SERVICE_URL=${ONTOLOGY_SERVICE_URL:-http://ontology-service:${ONTOLOGY_SERVICE_REST_PORT:-8082}}
      - VERSIONING_SERVICE_URL=${VERSIONING_SERVICE_URL:-http://versioning-service:${VERSIONING_SERVICE_REST_PORT:-8083}}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth-service:${AUTH_SERVICE_REST_PORT:-8081}}
      - METRICS_SERVICE_URL=${METRICS_SERVICE_URL:-http://metrics-service:${METRICS_SERVICE_CONTAINER_PORT:-8084}}
      - COMMENTING_SERVICE_URL=${COMMENTING_SERVICE_URL:-http://commenting-service:${COMMENTING_SERVICE_CONTAINER_PORT:-8087}}
      - GRPC_ONTOLOGY_ADDR=${GRPC_ONTOLOGY_ADDR:-ontology-service:${ONTOLOGY_SERVICE_GRPC_PORT:-9001}}
      - GRPC_VERSIONING_ADDR=${GRPC_VERSIONING_ADDR:-versioning-service:${VERSIONING_SERVICE_CONTAINER_GRPC_PORT:-9002}}
      - GRPC_AUTH_ADDR=${GRPC_AUTH_ADDR:-auth-service:${AUTH_SERVICE_CONTAINER_GRPC_PORT:-9003}}
      - GRPC_COMMENTING_ADDR=${GRPC_COMMENTING_ADDR:-commenting-service:${COMMENTING_SERVICE_CONTAINER_GRPC_PORT:-9004}}
      - GRPC_PUBLISHER_ADDR=${GRPC_PUBLISHER_ADDR:-publisher-service:${PUBLISHER_SERVICE_CONTAINER_GRPC_PORT:-9005}}
      - GRPC_PUBLIC_BROWSE_ADDR=${GRPC_PUBLIC_BROWSE_ADDR:-public-browse-api:${PUBLIC_BROWSE_CONTAINER_GRPC_PORT:-9011}}
      - GRPC_TLS_ENABLED=${GRPC_TLS_ENABLED:-false}
      - GRPC_CA_CERT_FILE=${GRPC_CA_CERT_FILE:-}
      - KEYCLOAK_JWKS_URL=${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/vedo-core/protocol/openid-connect/certs}
      - ENABLE_SWAGGER_UI=${ENABLE_SWAGGER_UI:-true}
      - UPSTREAM_TIMEOUT=${UPSTREAM_TIMEOUT:-30}
      - QUERY_MAX_LIMIT=${QUERY_MAX_LIMIT:-1000}
      - REDIS_URL=${REDIS_URL:-redis://redis:${REDIS_CONTAINER_PORT:-6379}}
    depends_on:
      ontology-service:
        condition: service_healthy
      versioning-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      commenting-service:
        condition: service_healthy
      publisher-service:
        condition: service_healthy
      public-browse-api:
        condition: service_healthy
      ai-orchestration-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${API_GATEWAY_CONTAINER_PORT:-8080}/health"]

  # ── Ontology Service — Rust (Neo4j) ────────────────────
  ontology-service:
    build:
      context: ..
      dockerfile: tools/dockerfiles/Dockerfile.rust
      args:
        SERVICE_DIR: apps/services
        BINARY_NAME: ontology-service
    expose:
      - "${ONTOLOGY_SERVICE_REST_PORT:-8082}"
    environment:
      - HOST=${ONTOLOGY_SERVICE_HOST:-0.0.0.0}
      - SERVICE_PORT=${ONTOLOGY_SERVICE_REST_PORT:-8082}
      - SERVICE_VERSION=${SERVICE_VERSION:-dev}
      - GRPC_PORT=${ONTOLOGY_SERVICE_GRPC_PORT:-9001}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:${NEO4J_BOLT_CONTAINER_PORT:-7687}}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - GRPC_TLS_ENABLED=${GRPC_TLS_ENABLED:-false}
      - GRPC_TLS_CERT_FILE=${GRPC_TLS_CERT_FILE:-}
      - GRPC_TLS_KEY_FILE=${GRPC_TLS_KEY_FILE:-}
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/${ONTOLOGY_SERVICE_GRPC_PORT:-9001}; printf \"\" >&3; echo \"gRPC health via grpc_health_probe recommended\"'"]

  # ── Versioning Service — Rust (PostgreSQL) ─────────────
  versioning-service:
    build:
      context: ..
      dockerfile: tools/dockerfiles/Dockerfile.rust
      args:
        SERVICE_DIR: apps/services
        BINARY_NAME: versioning-service
    expose:
      - "${VERSIONING_SERVICE_REST_PORT:-8083}"
      - "${VERSIONING_SERVICE_CONTAINER_GRPC_PORT:-9002}"
    environment:
      - HOST=${VERSIONING_SERVICE_HOST:-0.0.0.0}
      - SERVICE_PORT=${VERSIONING_SERVICE_REST_PORT:-8083}
      - SERVICE_VERSION=${SERVICE_VERSION:-dev}
      - GRPC_PORT=${VERSIONING_SERVICE_CONTAINER_GRPC_PORT:-9002}
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:${POSTGRES_CONTAINER_PORT:-5432}/vedo_versioning}
      - GRPC_TLS_ENABLED=${GRPC_TLS_ENABLED:-false}
      - GRPC_TLS_CERT_FILE=${GRPC_TLS_CERT_FILE:-}
      - GRPC_TLS_KEY_FILE=${GRPC_TLS_KEY_FILE:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/${VERSIONING_SERVICE_CONTAINER_GRPC_PORT:-9002}'"]

  # ── Auth Service — Go (Keycloak) ───────────────────────
  auth-service:
    build:
      context: ..
      dockerfile: tools/dockerfiles/Dockerfile.go
      args:
        SERVICE_DIR: apps/services
        BINARY_NAME: auth-service
    expose:
      - "${AUTH_SERVICE_REST_PORT:-8081}"
      - "${AUTH_SERVICE_CONTAINER_GRPC_PORT:-9003}"
    environment:
      - HOST=${AUTH_SERVICE_HOST:-0.0.0.0}
      - SERVICE_PORT=${AUTH_SERVICE_REST_PORT:-8081}
      - SERVICE_VERSION=${SERVICE_VERSION:-dev}
      - GRPC_PORT=${AUTH_SERVICE_CONTAINER_GRPC_PORT:-9003}
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://keycloak:8080}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-vedo-core}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-vedo-core-api}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-vedo-core-api-secret}
      - GRPC_TLS_ENABLED=${GRPC_TLS_ENABLED:-false}
      - GRPC_TLS_CERT_FILE=${GRPC_TLS_CERT_FILE:-}
      - GRPC_TLS_KEY_FILE=${GRPC_TLS_KEY_FILE:-}
      - AUTH_SERVICE_DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:${POSTGRES_CONTAINER_PORT:-5432}/vedo_org?sslmode=disable
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${AUTH_SERVICE_REST_PORT:-8081}/health"]

  # ── Metrics Service — Python ───────────────────────────
  metrics-service:
    build:
      context: ..
      dockerfile: tools/dockerfiles/Dockerfile.python
      args:
        SERVICE_DIR: apps/services/metrics-service
    expose:
      - "${METRICS_SERVICE_CONTAINER_REST_PORT:-8084}"
    environment:
      - HOST=${METRICS_SERVICE_HOST:-0.0.0.0}
      - SERVICE_PORT=${METRICS_SERVICE_CONTAINER_REST_PORT:-8084}
      - SERVICE_VERSION=${SERVICE_VERSION:-dev}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:${RABBITMQ_CONTAINER_AMQP_PORT:-5672}/}
      - REDIS_URL=${REDIS_URL:-redis://redis:${REDIS_CONTAINER_PORT:-6379}}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/${METRICS_SERVICE_CONTAINER_REST_PORT:-8084}; printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]

  # ── Publishing UI — Vue 3 viewer ──────────────────────
  publish-browse-ui:
    build:
      context: ..
      dockerfile: tools/dockerfiles/Dockerfile.typescript
      args:
        SERVICE_DIR: apps/services/publish-browse-ui
    ports:
      - "${PUBLISH_BROWSE_UI_PORT:-3002}:${PUBLISH_BROWSE_UI_CONTAINER_PORT:-3002}"
    environment:
      - VEDO_APP_VERSION=${SERVICE_VERSION:-dev}
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${PUBLISH_BROWSE_UI_CONTAINER_PORT:-3002}/health"]

  # ── Publisher Service — Rust ───────────────────────────
  publisher-service:
    build:
      context: ..
      dockerfile: tools/dockerfiles/Dockerfile.rust
      args:
        SERVICE_DIR: apps/services
        BINARY_NAME: publisher-service
    expose:
      - "${PUBLISHER_SERVICE_REST_PORT:-8086}"
      - "${PUBLISHER_SERVICE_CONTAINER_GRPC_PORT:-9005}"
    environment:
      - HOST=${PUBLISHER_SERVICE_HOST:-0.0.0.0}
      - SERVICE_PORT=${PUBLISHER_SERVICE_REST_PORT:-8086}
      - SERVICE_VERSION=${SERVICE_VERSION:-dev}
      - GRPC_PORT=${PUBLISHER_SERVICE_CONTAINER_GRPC_PORT:-9005}
      - GRPC_TLS_ENABLED=${GRPC_TLS_ENABLED:-false}
      - GRPC_TLS_CERT_FILE=${GRPC_TLS_CERT_FILE:-}
      - GRPC_TLS_KEY_FILE=${GRPC_TLS_KEY_FILE:-}
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/${PUBLISHER_SERVICE_CONTAINER_GRPC_PORT:-9005}'"]

  # ── Public Browse API — Rust read-only ─────────────────
  public-browse-api:
    build:
      context: ..
      dockerfile: tools/dockerfiles/Dockerfile.rust
      args:
        SERVICE_DIR: apps/services
        BINARY_NAME: public-browse-api
    expose:
      - "${PUBLIC_BROWSE_REST_PORT:-8087}"
      - "${PUBLIC_BROWSE_CONTAINER_GRPC_PORT:-9011}"
    environment:
      - HOST=${PUBLIC_BROWSE_HOST:-0.0.0.0}
      - SERVICE_PORT=${PUBLIC_BROWSE_REST_PORT:-8087}
      - SERVICE_VERSION=${SERVICE_VERSION:-dev}
      - GRPC_PORT=${PUBLIC_BROWSE_CONTAINER_GRPC_PORT:-9011}
      - GRPC_TLS_ENABLED=${GRPC_TLS_ENABLED:-false}
      - GRPC_TLS_CERT_FILE=${GRPC_TLS_CERT_FILE:-}
      - GRPC_TLS_KEY_FILE=${GRPC_TLS_KEY_FILE:-}
    depends_on:
      publisher-service:
        condition: service_healthy
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/${PUBLIC_BROWSE_CONTAINER_GRPC_PORT:-9011}'"]

  # ── Commenting Service — Go ────────────────────────────
  commenting-service:
    build:
      context: ..
      dockerfile: tools/dockerfiles/Dockerfile.go
      args:
        SERVICE_DIR: apps/services
        BINARY_NAME: commenting-service
    expose:
      - "${COMMENTING_SERVICE_REST_PORT:-8085}"
      - "${COMMENTING_SERVICE_CONTAINER_GRPC_PORT:-9004}"
    environment:
      - HOST=${COMMENTING_SERVICE_HOST:-0.0.0.0}
      - SERVICE_PORT=${COMMENTING_SERVICE_REST_PORT:-8085}
      - SERVICE_VERSION=${SERVICE_VERSION:-dev}
      - GRPC_PORT=${COMMENTING_SERVICE_CONTAINER_GRPC_PORT:-9004}
      - GRPC_TLS_ENABLED=${GRPC_TLS_ENABLED:-false}
      - GRPC_TLS_CERT_FILE=${GRPC_TLS_CERT_FILE:-}
      - GRPC_TLS_KEY_FILE=${GRPC_TLS_KEY_FILE:-}
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${COMMENTING_SERVICE_REST_PORT:-8085}/health"]

  # ── Ticket API — Go ────────────────────────────────────
  ticket-api:
    build:
      context: ..
      dockerfile: tools/dockerfiles/Dockerfile.go
      args:
        SERVICE_DIR: apps/services
        BINARY_NAME: ticket-api
    expose:
      - "${TICKET_API_CONTAINER_GRPC_PORT:-9010}"
      - "${TICKET_API_CONTAINER_REST_PORT:-8088}"
    environment:
      - HOST=${TICKET_API_HOST:-0.0.0.0}
      - STUB_PORT=${TICKET_API_CONTAINER_REST_PORT:-8088}
      - SERVICE_PORT=${TICKET_API_CONTAINER_REST_PORT:-8088}
      - GRPC_PORT=${TICKET_API_CONTAINER_GRPC_PORT:-9010}
      - APP_ENV=${APP_ENV:-development}
      - SERVICE_VERSION=${SERVICE_VERSION:-dev}
      - APP_VERSION=${APP_VERSION:-0.2.0}
      - GRPC_TLS_ENABLED=${GRPC_TLS_ENABLED:-false}
      - GRPC_TLS_CERT_FILE=${GRPC_TLS_CERT_FILE:-}
      - GRPC_TLS_KEY_FILE=${GRPC_TLS_KEY_FILE:-}
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${TICKET_API_CONTAINER_REST_PORT:-8088}/health"]

  # ── Ticket Classifier — Python ─────────────────────────
  ticket-classifier:
    build:
      context: ..
      dockerfile: tools/dockerfiles/Dockerfile.python
      args:
        SERVICE_DIR: apps/services/ticket-classifier
    expose:
      - "${TICKET_CLASSIFIER_CONTAINER_PORT:-8089}"
    environment:
      - HOST=${TICKET_CLASSIFIER_HOST:-0.0.0.0}
      - SERVICE_PORT=${TICKET_CLASSIFIER_CONTAINER_PORT:-8089}
      - SERVICE_VERSION=${SERVICE_VERSION:-dev}
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/${TICKET_CLASSIFIER_CONTAINER_PORT:-8089}; printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]

  # ── Ticket Telemetry Listener — Go ─────────────────────
  ticket-telemetry-listener:
    build:
      context: ..
      dockerfile: tools/dockerfiles/Dockerfile.go
      args:
        SERVICE_DIR: apps/services
        BINARY_NAME: ticket-telemetry-listener
    expose:
      - "${TICKET_TELEMETRY_CONTAINER_STUB_PORT:-8090}"
    environment:
      - STUB_PORT=${TICKET_TELEMETRY_CONTAINER_STUB_PORT:-8090}
      - SERVICE_VERSION=${SERVICE_VERSION:-dev}
      - CLASSIFIER_URL=${CLASSIFIER_URL:-http://ticket-classifier:${TICKET_CLASSIFIER_CONTAINER_PORT:-8089}}
    depends_on:
      ticket-classifier:
        condition: service_healthy
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${TICKET_TELEMETRY_CONTAINER_STUB_PORT:-8090}/health"]

  # ── Document Extractor — Python ────────────────────────
  document-extractor:
    build:
      context: ..
      dockerfile: tools/dockerfiles/Dockerfile.python
      args:
        SERVICE_DIR: apps/services/document-extractor
    expose:
      - "${DOCUMENT_EXTRACTOR_HTTP_PORT:-8092}"
      - "${DOCUMENT_EXTRACTOR_CONTAINER_GRPC_PORT:-9013}"
    environment:
      - HOST=${DOCUMENT_EXTRACTOR_HOST:-0.0.0.0}
      - SERVICE_PORT=${DOCUMENT_EXTRACTOR_HTTP_PORT:-8092}
      - SERVICE_VERSION=${SERVICE_VERSION:-dev}
      - ONTOLOGY_SERVICE_GRPC_URL=${ONTOLOGY_SERVICE_GRPC_URL:-ontology-service:${ONTOLOGY_SERVICE_GRPC_PORT:-9001}}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_PROVIDERS_OLLAMA_BASE_URL=${LLM_PROVIDERS_OLLAMA_BASE_URL:-http://localhost:${OLLAMA_PORT:-11434}/v1}
      - LLM_PROVIDERS_OLLAMA_MODEL=${LLM_PROVIDERS_OLLAMA_MODEL:-llama3}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-20}
    depends_on:
      ontology-service:
        condition: service_healthy
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/${DOCUMENT_EXTRACTOR_HTTP_PORT:-8092}; printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]

  # ── AI Orchestration Service — Go gRPC ─────────────────
  ai-orchestration-service:
    build:
      context: ..
      dockerfile: tools/dockerfiles/Dockerfile.go
      args:
        SERVICE_DIR: apps/services
        BINARY_NAME: ai-orchestration-service
    expose:
      - "${AI_ORCH_HEALTH_PORT:-8093}"
      - "${AI_ORCH_GRPC_PORT:-9014}"
    environment:
      - HOST=0.0.0.0
      - SERVICE_VERSION=${SERVICE_VERSION:-dev}
      - GRPC_PORT=${AI_ORCH_GRPC_PORT:-9014}
      - HEALTH_PORT=${AI_ORCH_HEALTH_PORT:-8093}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:${REDIS_CONTAINER_PORT:-6379}}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${AI_ORCH_HEALTH_PORT:-8093}/health"]

  # ── Ticket Notifier — Go ───────────────────────────────
  ticket-notifier:
    build:
      context: ..
      dockerfile: tools/dockerfiles/Dockerfile.go
      args:
        SERVICE_DIR: apps/services
        BINARY_NAME: ticket-notifier
    expose:
      - "${TICKET_NOTIFIER_CONTAINER_STUB_PORT:-8091}"
    environment:
      - STUB_PORT=${TICKET_NOTIFIER_CONTAINER_STUB_PORT:-8091}
      - SERVICE_VERSION=${SERVICE_VERSION:-dev}
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${TICKET_NOTIFIER_CONTAINER_STUB_PORT:-8091}/health"]

  # ═══════════════════════════════════════════════════════
  # ── Data Stores ──────────────────────────────────────
  # ═══════════════════════════════════════════════════════

  neo4j:
    image: neo4j:5.15-community
    hostname: neo4j
    extra_hosts:
      - "neo4j:127.0.0.1"
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:${NEO4J_HTTP_CONTAINER_PORT:-7474}"
      - "${NEO4J_BOLT_PORT:-7687}:${NEO4J_BOLT_CONTAINER_PORT:-7687}"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/password}
    volumes:
      - neo4j_data:/data
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-password} 'RETURN 1' || exit 1"]
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:${POSTGRES_CONTAINER_PORT:-5432}"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-vedo_versioning}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:${REDIS_CONTAINER_PORT:-6379}"
    volumes:
      - redis_data:/data
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:${RABBITMQ_CONTAINER_AMQP_PORT:-5672}"
      - "${RABBITMQ_MGMT_PORT:-15672}:${RABBITMQ_CONTAINER_MGMT_PORT:-15672}"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "rabbitmq-diagnostics", "ping"]

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    ports:
      - "${MINIO_API_PORT:-9000}:${MINIO_API_CONTAINER_PORT:-9000}"
      - "${MINIO_CONSOLE_PORT:-9001}:${MINIO_CONSOLE_CONTAINER_PORT:-9001}"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":${MINIO_CONSOLE_CONTAINER_PORT:-9001}"
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "mc", "ready", "local"]
      start_period: 10s

  # ── Vedo CLI build step (compile-only) ─────────────────
  vedo-cli-build:
    profiles: ["local", "ci"]
    image: golang:1.21-alpine
    working_dir: /app
    volumes:
      - ../src/cli:/app
    command: >
      sh -c "go build -o /dev/null ."
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "exit 0"]
      start_period: 0s

  # ── Keycloak ───────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    ports:
      - "${KC_HOSTNAME_PORT:-8180}:${KC_CONTAINER_PORT:-8080}"
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_HEALTH_ENABLED=true
      - KC_HOSTNAME=${KC_HOSTNAME:-localhost}
      - KC_HOSTNAME_PORT=${KC_HOSTNAME_PORT:-8180}
      - KC_HTTP_ENABLED=${KC_HTTP_ENABLED:-true}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/vedo-core-realm.json:/opt/keycloak/data/import/vedo-core-realm.json:ro
    command: start-dev --import-realm
    networks:
      - vedo-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/${KC_CONTAINER_PORT:-8080}; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 15s
      retries: 10
      start_period: 60s

networks:
  vedo-network:
    driver: bridge

volumes:
  neo4j_data:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  keycloak_data:
