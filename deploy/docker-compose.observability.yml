services:
  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v2.47.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:${PROMETHEUS_CONTAINER_PORT:-9090}"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.listen-address=:${PROMETHEUS_CONTAINER_PORT:-9090}"
    networks:
      - vedo-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:${PROMETHEUS_CONTAINER_PORT:-9090}/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:10.2.0
    ports:
      - "${GRAFANA_PORT:-3001}:${GRAFANA_CONTAINER_PORT:-3000}"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
            - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
            - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - vedo-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:${GRAFANA_CONTAINER_PORT:-3000}/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  loki:
    profiles: ["obs"]
    image: grafana/loki:2.9.0
    user: root
    ports:
      - "${LOKI_PORT:-3100}:${LOKI_CONTAINER_PORT:-3100}"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/data/loki
    command:
      - -config.file=/etc/loki/config.yml
      - -querier.max-query-lookback=2880h
    networks:
      - vedo-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:${LOKI_CONTAINER_PORT:-3100}/ready"]
      interval: 10s
      timeout: 5s
      retries: 3

  tempo:
    profiles: ["obs"]
    image: grafana/tempo:2.2.0
    ports:
      - "${TEMPO_HTTP_PORT:-3200}:${TEMPO_HTTP_CONTAINER_PORT:-3200}"
      - "${TEMPO_OTLP_GRPC_PORT:-4317}:${TEMPO_OTLP_GRPC_CONTAINER_PORT:-4317}"
      - "${TEMPO_OTLP_HTTP_PORT:-4318}:${TEMPO_OTLP_HTTP_CONTAINER_PORT:-4318}"
    volumes:
      - ./observability/tempo/tempo-config.yml:/etc/tempo/config.yml:ro
      - tempo_data:/data/tempo
    command: -config.file=/etc/tempo/config.yml
    networks:
      - vedo-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:${TEMPO_HTTP_CONTAINER_PORT:-3200}/ready"]
      interval: 10s
      timeout: 5s
      retries: 3

  otel-collector:
    profiles: ["obs"]
    image: otel/opentelemetry-collector-contrib:0.91.0
    ports:
      - "${OTEL_COLLECTOR_PROMETHEUS_PORT:-8888}:${OTEL_COLLECTOR_PROMETHEUS_CONTAINER_PORT:-8888}"
      - "${OTEL_COLLECTOR_HEALTH_PORT:-8889}:${OTEL_COLLECTOR_HEALTH_CONTAINER_PORT:-8889}"
    volumes:
      - ./observability/otel-collector/config.yml:/etc/otel-collector/config.yml:ro
    command: --config /etc/otel-collector/config.yml
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    networks:
      - vedo-network
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
