name: vedo-core-test

# =============================================================================
# Full-stack test environment for E2E (Playwright) and integration tests.
# =============================================================================
# Extends docker-compose.yml with a dev JWT public key so the API Gateway
# accepts RS256 tokens signed with tests/e2e/playwright/test-jwt-key.pem
# instead of requiring a running Keycloak for token verification.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   pnpm exec playwright test
#
# The gateway logs a warning when JWT_DEV_PUBLIC_KEY_PEM is active.
# NEVER deploy this file to production.
# =============================================================================

include:
  - docker-compose.yml

services:
  api-gateway:
    environment:
      JWT_DEV_PUBLIC_KEY_PEM: |
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA7KRKYjWhkiD9Zk+yYAzz
        eK0+feO2EsbLcr7gAq21lV0QcnE1v6pCeU6DLsp5KQXYFbWskYsbZb5c4ZTploGG
        En39vt68aaQHImUbsklDnHPg/I1oG9eKGjwfrK2jcQhJM17+Q5d1VVbGDpkUKw67
        bQk6OXkA9f5EkI0SAatO3T50TuTETno0nWdl97IRat9Z9eTRRlbqSKhIOmPyhC1G
        Yhj1IHcIlc3M0krMD2/hAzkp15K2KAPxZuH4D/pj/jPZnMOOXDonmOBwBBcjUZRl
        jahrd7wBIAyAbSbhgO3ggYfjuhubE+qO1bPMtvwLIId5ib0HBjQhdOwjW5PX3URw
        cQIDAQAB
        -----END PUBLIC KEY-----
