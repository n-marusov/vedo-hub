name: vedo-core-test

# =============================================================================
# Full-stack test environment for E2E (Playwright) and integration tests.
# =============================================================================
# Extends docker-compose.yml with a dev JWT public key so the API Gateway
# accepts RS256 tokens signed with tests/e2e/playwright/test-jwt-key.pem
# instead of requiring a running Keycloak for token verification.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   pnpm exec playwright test
#
# The gateway logs a warning when JWT_DEV_PUBLIC_KEY_PEM is active.
# NEVER deploy this file to production.
# =============================================================================

include:
  - docker-compose.yml

services:
  api-gateway:
    environment:
      JWT_DEV_PUBLIC_KEY_PEM: |
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAmmscOz8ovHi1a7WzwJdZ
        Y55rwiv4yTTfqwWlI5m7ecwJBexyPc8lHXIxlYCZfnyvUAVzjzlxRVbwRvsiyKUr
        PhXxeKA+NbsRoab8wH7K7OXjmBcDknZlcibmrQe6rwt6P8KmOKQZdnEFjusw504L
        jH2cEoLUfNQixfH7jBQ9+raoPlH1IlDENr1E0IDdtem+5Po4W2dWIo59ytJgF4Vy
        6ctnyHw1lOLvXuG3boUwLPUffAITTZIMoMeTCftxBa0R2UAOjVNJWqKyDY4dw3PF
        77KytZdl92c+XRG4tsfm3viNfCQxiGpKR977wPklREtS1OnQv2KadbaL54J1LH4V
        ZwIDAQAB
        -----END PUBLIC KEY-----
