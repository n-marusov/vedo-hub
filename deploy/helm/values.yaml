# @ctx: DEPLOY-OPS-001 Helm values for all VEDO Core services
# @hlv INV-DEPLOYMENT-OPERATIONS-0084 Rolling update default for dev/staging/minor/patch
global:
  environment: dev
  deploymentModel: saas
  imageRegistry: registry.vedo.dev
  imageTag: latest
  imagePullPolicy: IfNotPresent
  dnsDomain: vedo.local

frontend:
  name: frontend
  replicaCount: 2
  image:
    repository: vedo-frontend
    tag: ""
  service:
    port: 3000
  ingress:
    enabled: true
    host: app.vedo.local
    path: /
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m
  env:
    VITE_API_URL: http://api-gateway:8080
    VITE_WS_URL: ws://api-gateway:8080
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

apiGateway:
  name: api-gateway
  replicaCount: 2
  image:
    repository: vedo-api-gateway
    tag: ""
  service:
    port: 8080
  ingress:
    enabled: true
    host: api.vedo.local
    path: /
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m
  env:
    HOST: "0.0.0.0"
    PORT: "8080"
    ONTOLOGY_SERVICE_URL: http://ontology-service:8081
    VERSIONING_SERVICE_URL: http://versioning-service:8082
    AUTH_SERVICE_URL: http://auth-service:8084
  readinessProbe:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  livenessProbe:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 20
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

ontologyService:
  name: ontology-service
  replicaCount: 2
  image:
    repository: vedo-ontology-service
    tag: ""
  service:
    port: 8081
  resources:
    requests:
      memory: 256Mi
      cpu: 200m
    limits:
      memory: 512Mi
      cpu: 500m
  env:
    HOST: "0.0.0.0"
    PORT: "8080"
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: neo4j
    NEO4J_PASSWORD: password
  readinessProbe:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
  livenessProbe:
    path: /health
    initialDelaySeconds: 20
    periodSeconds: 20
  persistence:
    enabled: false
  strategy:
    type: RollingUpdate

versioningService:
  name: versioning-service
  replicaCount: 2
  image:
    repository: vedo-versioning-service
    tag: ""
  service:
    port: 8082
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 300m
  env:
    HOST: "0.0.0.0"
    PORT: "8080"
    DATABASE_URL: postgres://postgres:password@postgres:5432/vedo_versioning
  readinessProbe:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
  livenessProbe:
    path: /health
    initialDelaySeconds: 20
    periodSeconds: 20
  strategy:
    type: RollingUpdate

authService:
  name: auth-service
  replicaCount: 2
  image:
    repository: vedo-auth-service
    tag: ""
  service:
    port: 8084
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m
  env:
    HOST: "0.0.0.0"
    PORT: "8080"
    KEYCLOAK_URL: http://keycloak:8080/auth
  readinessProbe:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  livenessProbe:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 20
  strategy:
    type: RollingUpdate

metricsService:
  name: metrics-service
  replicaCount: 1
  image:
    repository: vedo-metrics-service
    tag: ""
  service:
    port: 8086
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 300m
  env:
    HOST: "0.0.0.0"
    PORT: "8080"
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    REDIS_URL: redis://redis:6379
  readinessProbe:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
  livenessProbe:
    path: /health
    initialDelaySeconds: 20
    periodSeconds: 20
  strategy:
    type: RollingUpdate

neo4j:
  name: neo4j
  image:
    repository: neo4j
    tag: 5.15-community
  service:
    boltPort: 7687
    httpPort: 7474
  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: 1
  persistence:
    enabled: true
    size: 10Gi
  env:
    NEO4J_AUTH: neo4j/password

postgresql:
  name: postgres
  image:
    repository: postgres
    tag: 16-alpine
  service:
    port: 5432
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  persistence:
    enabled: true
    size: 10Gi
  env:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: password
    POSTGRES_DB: vedo_versioning

redis:
  name: redis
  image:
    repository: redis
    tag: 7-alpine
  service:
    port: 6379
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m
  persistence:
    enabled: true
    size: 5Gi

rabbitmq:
  name: rabbitmq
  image:
    repository: rabbitmq
    tag: 3.12-management-alpine
  service:
    amqpPort: 5672
    managementPort: 15672
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m
  persistence:
    enabled: true
    size: 5Gi
  env:
    RABBITMQ_DEFAULT_USER: guest
    RABBITMQ_DEFAULT_PASS: guest

keycloak:
  name: keycloak
  image:
    repository: quay.io/keycloak/keycloak
    tag: 23.0
  service:
    port: 8080
  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: 1
  env:
    KEYCLOAK_ADMIN: admin
    KEYCLOAK_ADMIN_PASSWORD: admin
    KC_HEALTH_ENABLED: "true"

prometheus:
  name: prometheus
  image:
    repository: prom/prometheus
    tag: v2.47.0
  service:
    port: 9090
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  persistence:
    enabled: true
    size: 10Gi
  configMountPath: /etc/prometheus

grafana:
  name: grafana
  image:
    repository: grafana/grafana
    tag: 10.2.0
  service:
    port: 3000
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m
  persistence:
    enabled: true
    size: 5Gi
  env:
    GF_SECURITY_ADMIN_PASSWORD: admin

loki:
  name: loki
  image:
    repository: grafana/loki
    tag: 2.9.0
  service:
    port: 3100
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  persistence:
    enabled: true
    size: 10Gi

tempo:
  name: tempo
  image:
    repository: grafana/tempo
    tag: 2.2.0
  service:
    port: 3200
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  persistence:
    enabled: true
    size: 10Gi

otelCollector:
  name: otel-collector
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.91.0
  service:
    otlpGrpcPort: 4317
    otlpHttpPort: 4318
    metricsPort: 8888
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 300m
