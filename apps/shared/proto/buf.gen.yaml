version: v2
plugins:
  # Go
  - local: protoc-gen-go
    out: .
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: .
    opt: paths=source_relative
  # Rust (prost + tonic — order matters: prost must run before tonic)
  - local: protoc-gen-prost
    out: .
    opt: file_descriptor_set=true
  - local: protoc-gen-tonic
    out: .
