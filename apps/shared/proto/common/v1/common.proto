// Common types shared across all VEDO Core gRPC services.
syntax = "proto3";

package vedo.common.v1;

option go_package = "vedo-core/src/services/shared/proto/common/v1;commonv1";
option java_multiple_files = true;
option java_package = "com.vedo.common.v1";

// Timestamp wrapper for consistent time representation across services.
message Timestamp {
  int64 seconds = 1;   // Unix epoch seconds
  int32 nanos = 2;     // Nanosecond offset (0–999,999,999)
}

// Pagination parameters for list RPCs.
message PaginationRequest {
  int32 page_size = 1;   // Max items per page (default 20, max 100)
  string page_token = 2; // Opaque cursor for the next page (empty = first page)
}

// Pagination metadata in list responses.
message PaginationResponse {
  int32 total_count = 1;      // Total items across all pages
  string next_page_token = 2; // Opaque cursor for the next page (empty = last page)
}

// Error detail for gRPC error responses (carried in error details).
message ErrorDetail {
  string code = 1;        // Machine-readable error code (e.g., "ONTOLOGY-NOT-FOUND")
  string message = 2;     // Human-readable description
  string trace_id = 3;    // OpenTelemetry trace ID for correlation
  repeated string details = 4; // Additional context (e.g., validation errors)
}

// Standard health check response.
message HealthCheckResponse {
  enum ServingStatus {
    SERVING_STATUS_UNSPECIFIED = 0;
    SERVING_STATUS_SERVING = 1;
    SERVING_STATUS_NOT_SERVING = 2;
    SERVING_STATUS_UNKNOWN = 3;
  }
  ServingStatus status = 1;
  string service = 2;
  string version = 3;
}
