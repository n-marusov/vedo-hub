// Org management gRPC contract.
// Group hierarchy, project catalog, role-based membership, visibility levels.
syntax = "proto3";

package vedo.auth.v1;

option go_package = "vedo-core/src/services/shared/proto/auth/v1;authv1";
option java_multiple_files = true;
option java_package = "com.vedo.auth.v1";

import "common/v1/common.proto";

// =============================================================================
// Message Types
// =============================================================================

// Scope represents a group, project, or legacy ontology node in the hierarchy.
// Under the 1:1 Project ↔ Ontology model, 'project' is the canonical type for
// the workspace container. 'ontology' is retained as a legacy alias during the
// migration window. The ontology_id field carries the 1:1 paired Ontology
// identifier for project scopes (empty for groups).
message Scope {
  string id = 1;
  string type = 2;          // "group" or "project" (legacy "ontology" accepted during migration)
  string parent_id = 3;
  string name = 4;
  string description = 5;
  string visibility = 6;    // "Private", "Internal", "Public"
  string tenant_id = 7;
  int32 child_count = 8;
  int32 member_count = 9;
  string ontology_id = 10;  // 1:1 paired Ontology ID (set for projects, empty for groups)
  string upstream_project_id = 11;  // Set for forks — references the source Project
  string slug = 12;              // GitLab-style human-readable identifier for GUI navigation
}

// Member represents a user's role assignment within a scope.
message Member {
  string user_id = 1;
  string scope = 2;
  string role = 3;
  bool inherited = 4;
  string username = 5;
  string avatar_url = 6;
  string added_at = 7;
}

// AttributePolicy defines an attribute-based access control policy.
message AttributePolicy {
  string id = 1;
  string scope = 2;
  map<string, string> pattern = 3;
  string right = 4;
  string created_at = 5;
}

// =============================================================================
// Group RPCs
// =============================================================================

message CreateGroupRequest {
  string name = 1;
  string description = 2;
  string parent_id = 3;
  string organization_id = 4;
  string visibility = 5;  // "Private", "Internal", "Public" — default "Private" server-side
  string slug = 6;        // GitLab-style identifier; derived from name when empty
}

message CreateGroupResponse {
  Scope group = 1;
  vedo.common.v1.ErrorDetail error = 2;
}

message GetGroupRequest {
  string id = 1;
  string organization_id = 2;
}

message GetGroupResponse {
  Scope group = 1;
  vedo.common.v1.ErrorDetail error = 2;
}

message ListGroupsRequest {
  string search = 1;
  string organization_id = 2;
  vedo.common.v1.PaginationRequest pagination = 3;
}

message ListGroupsResponse {
  repeated Scope groups = 1;
  vedo.common.v1.PaginationResponse pagination = 2;
  vedo.common.v1.ErrorDetail error = 3;
}

message UpdateGroupRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string organization_id = 4;
  string visibility = 5;  // "Private", "Internal", "Public" — same enum as CreateGroup
}

message UpdateGroupResponse {
  Scope group = 1;
  vedo.common.v1.ErrorDetail error = 2;
}

message DeleteGroupRequest {
  string id = 1;
  string organization_id = 2;
}

message DeleteGroupResponse {
  vedo.common.v1.ErrorDetail error = 1;
}

message ListChildGroupsRequest {
  string parent_id = 1;
  string organization_id = 2;
}

message ListChildGroupsResponse {
  repeated Scope groups = 1;
  vedo.common.v1.ErrorDetail error = 2;
}

// =============================================================================
// Project RPCs
// =============================================================================

message CreateProjectRequest {
  string name = 1;
  string description = 2;
  string group_id = 3;
  string organization_id = 4;
  string visibility = 5;  // "Private", "Internal", "Public" — default "Private" server-side
  string slug = 6;        // GitLab-style identifier; derived from name when empty
}

message CreateProjectResponse {
  Scope project = 1;
  vedo.common.v1.ErrorDetail error = 2;
}

message GetProjectRequest {
  string id = 1;
  string organization_id = 2;
}

message GetProjectResponse {
  Scope project = 1;
  vedo.common.v1.ErrorDetail error = 2;
}

message ListProjectsRequest {
  string search = 1;
  string group_id = 2;
  string sort_by = 3;
  string sort_dir = 4;
  int32 page = 5;
  int32 per_page = 6;
  string organization_id = 7;
}

message ListProjectsResponse {
  repeated Scope projects = 1;
  int32 total = 2;
  vedo.common.v1.ErrorDetail error = 3;
}

message UpdateProjectRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string organization_id = 4;
}

message UpdateProjectResponse {
  Scope project = 1;
  vedo.common.v1.ErrorDetail error = 2;
}

message DeleteProjectRequest {
  string id = 1;
  string organization_id = 2;
}

message DeleteProjectResponse {
  vedo.common.v1.ErrorDetail error = 1;
}

// =============================================================================
// Membership RPCs
// =============================================================================

message AddMemberRequest {
  string scope = 1;
  string user_id = 2;
  string role = 3;
  string organization_id = 4;
}

message AddMemberResponse {
  Member member = 1;
  vedo.common.v1.ErrorDetail error = 2;
}

message UpdateMemberRoleRequest {
  string scope = 1;
  string user_id = 2;
  string role = 3;
  string organization_id = 4;
}

message UpdateMemberRoleResponse {
  Member member = 1;
  vedo.common.v1.ErrorDetail error = 2;
}

message RemoveMemberRequest {
  string scope = 1;
  string user_id = 2;
  string organization_id = 3;
}

message RemoveMemberResponse {
  vedo.common.v1.ErrorDetail error = 1;
}

message ListMembersRequest {
  string scope = 1;
  string organization_id = 2;
}

message ListMembersResponse {
  repeated Member members = 1;
  vedo.common.v1.ErrorDetail error = 2;
}

// =============================================================================
// Visibility RPCs
// =============================================================================

message SetVisibilityRequest {
  string scope = 1;
  string visibility = 2;
  string organization_id = 3;
}

message SetVisibilityResponse {
  vedo.common.v1.ErrorDetail error = 1;
}

message GetVisibilityRequest {
  string scope = 1;
  string organization_id = 2;
}

message GetVisibilityResponse {
  string visibility = 1;
  vedo.common.v1.ErrorDetail error = 2;
}

// =============================================================================
// Policy RPCs
// =============================================================================

message CreatePolicyRequest {
  string scope = 1;
  map<string, string> pattern = 2;
  string right = 3;
  string organization_id = 4;
}

message CreatePolicyResponse {
  AttributePolicy policy = 1;
  vedo.common.v1.ErrorDetail error = 2;
}

message ListPoliciesRequest {
  string scope = 1;
  string organization_id = 2;
}

message ListPoliciesResponse {
  repeated AttributePolicy policies = 1;
  vedo.common.v1.ErrorDetail error = 2;
}

message DeletePolicyRequest {
  string scope = 1;
  string policy_id = 2;
  string organization_id = 3;
}

message DeletePolicyResponse {
  vedo.common.v1.ErrorDetail error = 1;
}

// =============================================================================
// Access Check RPCs
// =============================================================================

message CheckAccessRequest {
  string user_id = 1;
  string scope = 2;
  string action = 3;
  string organization_id = 4;
}

message CheckAccessResponse {
  bool allowed = 1;
  string reason = 2;
  vedo.common.v1.ErrorDetail error = 3;
}

// Fork RPCs — templates-via-forks
// =============================================================================

message ForkProjectRequest {
  string source_project_id = 1;
  string user_id = 2;
  string organization_id = 3;
}

message ForkProjectResponse {
  Scope project = 1;
  vedo.common.v1.ErrorDetail error = 2;
}

// Move/Transfer RPCs — project relocation between groups
// =============================================================================

message MoveProjectRequest {
  string project_id = 1;
  string target_group_id = 2;  // Destination group ID
  string organization_id = 3;
}

message MoveProjectResponse {
  Scope project = 1;
  vedo.common.v1.ErrorDetail error = 2;
}

// =============================================================================
// Org Service
// =============================================================================

service OrgService {
  // Group management
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  rpc GetGroup(GetGroupRequest) returns (GetGroupResponse);
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  rpc UpdateGroup(UpdateGroupRequest) returns (UpdateGroupResponse);
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse);
  rpc ListChildGroups(ListChildGroupsRequest) returns (ListChildGroupsResponse);

  // Project management
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);

  // Membership management
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse);
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);

  // Visibility
  rpc SetVisibility(SetVisibilityRequest) returns (SetVisibilityResponse);
  rpc GetVisibility(GetVisibilityRequest) returns (GetVisibilityResponse);

  // Policy
  rpc CreatePolicy(CreatePolicyRequest) returns (CreatePolicyResponse);
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse);

  // Access check
  rpc CheckAccess(CheckAccessRequest) returns (CheckAccessResponse);

  // Fork (templates-via-forks)
  rpc ForkProject(ForkProjectRequest) returns (ForkProjectResponse);

  // Move/Transfer project between groups
  rpc MoveProject(MoveProjectRequest) returns (MoveProjectResponse);
}
