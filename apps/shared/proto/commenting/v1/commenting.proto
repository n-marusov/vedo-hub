// Commenting Service gRPC contract.
// Comments, mentions, and collaboration features.
syntax = "proto3";

package vedo.commenting.v1;

option go_package = "vedo-core/src/services/shared/proto/commenting/v1;commentingv1";
option java_multiple_files = true;
option java_package = "com.vedo.commenting.v1";

import "common/v1/common.proto";

// =============================================================================
// Comment Model
// =============================================================================

message Comment {
  string id = 1;
  string ontology_id = 2;
  string entity_id = 3;      // IRI of the commented entity (class, property, etc.)
  string author_id = 4;
  string body = 5;
  string parent_id = 6;      // reply thread parent
  repeated string mentions = 7; // mentioned user IDs
  string created_at = 8;
  string updated_at = 9;
}

// =============================================================================
// CreateComment
// =============================================================================

message CreateCommentRequest {
  string ontology_id = 1;
  string entity_id = 2;
  string body = 3;
  string parent_id = 4;
  repeated string mentions = 5;
}

message CreateCommentResponse {
  Comment comment = 1;
  vedo.common.v1.ErrorDetail error = 2;
}

// =============================================================================
// ListComments
// =============================================================================

message ListCommentsRequest {
  string ontology_id = 1;
  string entity_id = 2;
  vedo.common.v1.PaginationRequest pagination = 3;
}

message ListCommentsResponse {
  repeated Comment comments = 1;
  vedo.common.v1.PaginationResponse pagination = 2;
  vedo.common.v1.ErrorDetail error = 3;
}

// =============================================================================
// DeleteComment
// =============================================================================

message DeleteCommentRequest {
  string comment_id = 1;
}

message DeleteCommentResponse {
  bool success = 1;
  vedo.common.v1.ErrorDetail error = 2;
}

// =============================================================================
// Commenting Service
// =============================================================================

service CommentingService {
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse);
}
