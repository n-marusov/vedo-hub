[package]
name = "vedo-shared"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tower = { version = "0.4", features = ["util"] }
thiserror = "1"
tonic = { version = "0.12", features = ["gzip", "tls"] }
prost = "0.13"
prost-types = "0.13"
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "trace"] }
tracing-opentelemetry = "0.28"

[build-dependencies]
tonic-build = "0.12"
