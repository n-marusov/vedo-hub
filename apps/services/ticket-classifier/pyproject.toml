# Python project configuration — ticket-classifier service
# AI-assisted ticket auto-classification

[project]
name = "ticket-classifier"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
    "C4",     # flake8-comprehensions
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # Pylint
    "TRY",    # tryceratops
]

ignore = [
    "E501",    # line length — handled by formatter
    "PLR0913", # too many arguments
    "TRY003",  # avoid long exception messages
    "PLC0415", # import at top-level — conditional imports are valid here
    "PTH",     # use pathlib — pre-existing, not worth refactoring now
    "B904",    # raise ... from err — pre-existing pattern
    "TRY400",  # use logging.exception — pre-existing
    "TRY300",  # move to else block — pre-existing
    "PLW0603", # global statement — pre-existing pattern
    "B017",    # assert blind exception — pre-existing
    "PT011",   # pytest.raises too broad — pre-existing test patterns
    "TRY401",  # redundant exception in logging.exception — pre-existing
    "RUF012",  # mutable default values — pre-existing
    "PLR2004", # magic value comparison — pre-existing
    "PLR0911", # too many return statements — pre-existing
    "PLR0912", # too many branches — pre-existing
    "PLR0915", # too many statements — pre-existing
    "SIM",     # flake8-simplify — pre-existing, not worth refactoring now
    "E741",    # ambiguous variable name — pre-existing
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["S101", "PLR2004"]
"tests/**" = ["S101", "PLR2004"]
"main.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.basedpyright]
include = ["main.py"]
typeCheckingMode = "standard"
reportUnusedCallResult = "none"
reportImplicitOverride = "warning"

[dependency-groups]
dev = [
    "basedpyright>=1.39.6",
    "ruff",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
