map $http_x_trace_id $stub_trace_id {
  default $http_x_trace_id;
  "" $request_id;
}

map $http_x_correlation_id $stub_correlation_id {
  default $http_x_correlation_id;
  "" $request_id;
}

log_format service_json escape=json '{"service":"frontend","path":"$uri","status":$status,"trace_id":"$stub_trace_id","correlation_id":"$stub_correlation_id"}';

server {
  listen 3000;
  server_name _;

  access_log /dev/stdout service_json;
  error_log /dev/stderr warn;

  error_page 405 = @method_not_allowed;
  error_page 404 = @endpoint_not_found;

  # ── Compression ──────────────────────────────────────────────────────────
  gzip on;
  gzip_static on;         # serve pre-compressed .gz from builder stage
  gzip_vary on;           # Vary: Accept-Encoding for CDN/proxy
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;

  # ── Security headers (server-level) ──────────────────────────────────────
  # NOTE: nginx add_header in child blocks REPLACES parent headers.
  # Headers below are defaults; locations that set their own headers
  # must repeat these if needed.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ── Hashed static assets — cached 1 year (content hash = new filename) ──
  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
  }

  # ── index.html — NEVER cached (entrypoint rewrites config.js) ────────────
  location = / {
    if ($request_method != GET) { return 405; }
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    try_files /index.html =404;
  }

  location = /health {
    if ($request_method != GET) { return 405; }
    root /usr/share/nginx/html;
    default_type application/json;
    add_header Cache-Control "no-cache";
    try_files /health.json =404;
  }

  location = /config.js {
    if ($request_method != GET) { return 405; }
    root /usr/share/nginx/html;
    default_type application/javascript;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    try_files /config.js =404;
  }

  location = /ready {
    if ($request_method != GET) { return 405; }
    root /usr/share/nginx/html;
    default_type application/json;
    add_header Cache-Control "no-cache";
    try_files /ready.json =404;
  }

  location = /metrics {
    if ($request_method != GET) { return 405; }
    # When query params are present (e.g. /metrics?ontologyId=123), rewrite to
    # serve the Vue SPA. Without query params, serve the Prometheus text file.
    if ($args) {
      rewrite ^ /index.html last;
    }
    root /usr/share/nginx/html;
    default_type text/plain;
    add_header Cache-Control "no-cache";
    try_files /metrics.txt =404;
  }

  # ── SPA fallback ────────────────────────────────────────────────────────
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  # ── API proxy ────────────────────────────────────────────────────────────

  location = /api/v1/health {
    if ($request_method != GET) { return 405; }
    rewrite ^/api/v1/health$ /health break;
    proxy_pass http://api-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Trace-Id $stub_trace_id;
    proxy_set_header X-Correlation-Id $stub_correlation_id;
  }

  location = /api/v1/ready {
    if ($request_method != GET) { return 405; }
    rewrite ^/api/v1/ready$ /ready break;
    proxy_pass http://api-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Trace-Id $stub_trace_id;
    proxy_set_header X-Correlation-Id $stub_correlation_id;
  }

  location /api/v1/ {
    proxy_pass http://api-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Trace-Id $stub_trace_id;
    proxy_set_header X-Correlation-Id $stub_correlation_id;
  }

  # ── Error handlers ───────────────────────────────────────────────────────

  location @method_not_allowed {
    default_type application/json;
    return 405 '{"error":"METHOD_NOT_ALLOWED","message":"Method $request_method not allowed on $uri","available":["/","/health","/ready","/metrics"]}';
  }

  location @endpoint_not_found {
    default_type application/json;
    return 404 '{"error":"ENDPOINT_NOT_FOUND","message":"The requested endpoint $uri does not exist","available":["/","/health","/ready","/metrics"]}';
  }
}
