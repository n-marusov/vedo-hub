# Python project configuration — metrics-service
# Event-driven analytics and monitoring service

[project]
name = "metrics-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn==0.34.0",
    "aio-pika==9.5.2",
    "redis==5.2.1",
    "prometheus-client==0.21.0",
    "pydantic-settings==2.7.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
    "C4",     # flake8-comprehensions
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # Pylint
    "TRY",    # tryceratops
]

ignore = [
    "E501",    # line length — handled by formatter
    "PLR0913", # too many arguments
    "TRY003",  # avoid long exception messages
    "PLR2004", # magic value comparison — pre-existing
    "B904",    # raise ... from err — pre-existing pattern
    "TRY400",  # use logging.exception — pre-existing
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["S101", "PLR2004"]
"tests/**" = ["S101", "PLR2004"]
"main.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.basedpyright]
include = ["main.py", "config.py"]
typeCheckingMode = "standard"
reportUnusedCallResult = "none"
reportImplicitOverride = "warning"

[dependency-groups]
dev = [
    "basedpyright>=1.39.6",
    "ruff",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
