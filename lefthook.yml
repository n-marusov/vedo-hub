# =============================================================================
# Lefthook — Git hooks manager for VEDO Core
# See .ai-factory/references/lefthook.md for full configuration reference.
# Install:  lefthook install   (or make install-hooks)
# Skip:     LEFTHOOK=0 git commit
# =============================================================================

min_version: 2.1.0
assert_lefthook_installed: true
glob_matcher: doublestar

# Default timeout for all hooks — prevents indefinite hangs on Windows
run_timeout: 120

# ── Output verbosity ──
output:
  - meta
  - summary
  - empty_summary
  - success
  - failure
  - execution
  - execution_info
  - skips

# =============================================================================
# Pre-commit — runs on every commit (fast checks in parallel)
# =============================================================================
pre-commit:
  parallel: false
  jobs:
    # ── Generic file checks (merge conflicts, trailing whitespace) ──
    - name: generic-checks
      run: sh tools/scripts/pre-commit-generic.sh

    # ── Python: ruff lint + format ──
    - name: ruff
      glob: "**/*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true

    - name: ruff-format
      glob: "**/*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true

    # ── TypeScript / Vue: biome (frontend) ──
    - name: biome-frontend
      files: git diff --cached --name-only --diff-filter=ACMR -- apps/services/frontend/
      run: node apps/services/frontend/node_modules/@biomejs/biome/bin/biome check --write {files}
      stage_fixed: true

    # ── TypeScript / Vue: biome (publish-browse-ui) ──
    - name: biome-publish-browse-ui
      files: git diff --cached --name-only --diff-filter=ACMR -- apps/services/publish-browse-ui/
      run: node apps/services/publish-browse-ui/node_modules/@biomejs/biome/bin/biome check --write {files}
      stage_fixed: true

    # ── Go: gofmt + go vet — only when .go files staged ──
    - name: gofmt-vet
      glob: "**/*.go"
      run: sh tools/scripts/pre-commit-gofmt.sh

    # ── Rust: cargo fmt — only when .rs files staged ──
    - name: cargo-fmt
      glob: "**/*.rs"
      run: sh tools/scripts/pre-commit-cargo-fmt.sh

# =============================================================================
# Pre-push — runs on every push (slower checks, sequential)
# =============================================================================
pre-push:
  piped: true
  jobs:
    # ── Check that committed files parse as valid JSON ──
    - name: check-json
      run: echo json-check-ok

    # ── Check that committed files parse as valid YAML ──
    - name: check-yaml
      run: |
        files=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(yml|yaml)$' | grep -v 'pnpm-lock\.yaml' || true)
        if [ -n "$files" ] && command -v python3 > /dev/null 2>&1; then
          if ! python3 -c "import yaml; [yaml.safe_load(open(f)) for f in '''$files'''.split()]" 2>/dev/null; then
            echo "✖ Invalid YAML detected"
            exit 1
          fi
        fi

    # ── Go: golangci-lint — per-service iteration via script ──
    - name: golangci-lint
      run: sh tools/scripts/pre-commit-golangci-lint.sh

    # ── Rust: cargo clippy — per-service iteration via script ──
    - name: cargo-clippy
      run: sh tools/scripts/pre-commit-cargo-clippy.sh

    # ── Go module hygiene ──
    - name: go-mod-tidy
      run: |
        failed=0
        for dir in $(find apps/services apps/shared apps/vedo-cli -name go.mod -exec dirname {} \;); do
          if ! (cd "$dir" && go mod tidy && git diff --exit-code go.mod go.sum > /dev/null 2>&1); then
            echo "✖ go.mod/go.sum not tidy in $dir. Run 'go mod tidy' and commit the changes."
            failed=1
          fi
        done
        if [ "$failed" = "1" ]; then exit 1; fi

# =============================================================================
# Custom tasks — run on demand via `lefthook run <task-name>`
# =============================================================================
format:
  jobs:
    - name: fmt-python
      glob: "**/*.py"
      run: uv run ruff check --fix {all_files} && uv run ruff format {all_files}

    - name: fmt-frontend
      root: "apps/services/frontend/"
      run: npx biome check --write .

    - name: fmt-publish-browse-ui
      root: "apps/services/publish-browse-ui/"
      run: npx biome check --write .

    - name: fmt-go
      run: sh tools/scripts/pre-commit-gofmt.sh

    - name: fmt-rust
      run: sh tools/scripts/pre-commit-cargo-fmt.sh
